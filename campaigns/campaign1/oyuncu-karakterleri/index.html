<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #c9a84c;
      --gold-bright: #f5d080;
      --gold-dim: #7a6030;
      --parchment: #f2e8d0;
    }

    *, *::before, *::after { box-sizing: border-box; }

    @keyframes pageFadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes titleReveal {
      from { opacity: 0; letter-spacing: 18px; transform: translateY(-16px); }
      to   { opacity: 1; letter-spacing: 6px;  transform: translateY(0); }
    }
    @keyframes glowPulse {
      0%,100% { box-shadow: 0 0 10px var(--gold-dim), 0 0 30px rgba(201,168,76,0.1); }
      50%      { box-shadow: 0 0 22px var(--gold), 0 0 50px rgba(201,168,76,0.25); }
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.94); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    body {
      margin: 0;
      font-family: 'Lora', Georgia, serif;
      background: url('https://cdna.artstation.com/p/assets/images/images/041/430/008/large/jonny-sun-.jpg?1631684163') no-repeat center center fixed;
      background-size: cover;
      color: var(--parchment);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(5,3,1,0.85) 0%,
        rgba(10,8,6,0.70) 40%,
        rgba(10,8,6,0.78) 80%,
        rgba(5,3,1,0.92) 100%
      );
      z-index: 0;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
      z-index: 0;
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      padding: 3rem 1.5rem 5rem;
      text-align: center;
    }

    /* ── HEADER ── */
    .header {
      margin-bottom: 3.5rem;
      animation: pageFadeIn 1.2s ease both;
    }

    .campaign-seal {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.4rem;
    }
    .campaign-seal svg {
      width: 100%;
      height: 100%;
      opacity: 0.85;
      filter: drop-shadow(0 0 8px rgba(201,168,76,0.5));
    }

    .subtitle-pre {
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--gold-dim);
      margin-bottom: 0.6rem;
      opacity: 0.8;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.6rem, 5vw, 3.2rem);
      font-weight: 900;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--gold-bright);
      margin: 0 0 0.5rem;
      text-shadow:
        0 0 30px rgba(201,168,76,0.5),
        0 0 60px rgba(201,168,76,0.2),
        2px 2px 8px rgba(0,0,0,0.9);
      animation: titleReveal 1.4s cubic-bezier(.22,1,.36,1) .2s both;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 1.2rem auto;
      max-width: 500px;
    }
    .divider-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
    }
    .divider-diamond {
      width: 7px;
      height: 7px;
      background: var(--gold);
      transform: rotate(45deg);
      box-shadow: 0 0 8px rgba(201,168,76,0.6);
    }

    .subtitle-post {
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 0.9rem;
      color: rgba(242, 232, 208, 0.55);
      letter-spacing: 1px;
      margin-top: 0.6rem;
    }

    /* ── GRID ── */
    .character-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2rem;
      max-width: 1400px;
      margin: 0 auto 4rem;
    }

    /* ── CARD ── */
    .character-card {
      width: 190px;
      aspect-ratio: 3/4;
      position: relative;
      cursor: pointer;
      text-decoration: none;
      display: block;
      border-radius: 6px;
      box-shadow:
        0 0 0 1px rgba(201,168,76,0.25),
        0 4px 18px rgba(0,0,0,0.6);
      transition: box-shadow 0.3s ease, transform 0.35s ease;
      overflow: hidden;
      animation: cardIn 0.7s ease both;
    }

    .character-card:nth-child(1)  { animation-delay: 0.05s; }
    .character-card:nth-child(2)  { animation-delay: 0.10s; }
    .character-card:nth-child(3)  { animation-delay: 0.15s; }
    .character-card:nth-child(4)  { animation-delay: 0.20s; }
    .character-card:nth-child(5)  { animation-delay: 0.25s; }
    .character-card:nth-child(6)  { animation-delay: 0.30s; }
    .character-card:nth-child(7)  { animation-delay: 0.35s; }
    .character-card:nth-child(8)  { animation-delay: 0.40s; }
    .character-card:nth-child(9)  { animation-delay: 0.45s; }
    .character-card:nth-child(10) { animation-delay: 0.50s; }
    .character-card:nth-child(11) { animation-delay: 0.55s; }
    .character-card:nth-child(12) { animation-delay: 0.60s; }
    .character-card:nth-child(13) { animation-delay: 0.65s; }
    .character-card:nth-child(14) { animation-delay: 0.70s; }

    .character-card:hover {
      transform: scale(1.05);
      box-shadow:
        0 0 0 1.5px rgba(201,168,76,0.7),
        0 0 22px rgba(201,168,76,0.35),
        0 8px 28px rgba(0,0,0,0.8);
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 5px;
      overflow: hidden;
      background: rgba(5,3,1,0.9);
    }

    .character-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
      filter: brightness(0.88) contrast(1.08) saturate(0.9);
      transition: filter 0.35s ease;
    }

    .character-card:hover img {
      filter: brightness(1.0) contrast(1.1) saturate(1.0);
    }

    .card-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 2rem 0.75rem 0.85rem;
      background: linear-gradient(
        to top,
        rgba(5,3,1,0.97) 0%,
        rgba(5,3,1,0.75) 55%,
        transparent 100%
      );
      z-index: 3;
    }

    .character-name {
      font-family: 'Cinzel', serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--gold-bright);
      text-shadow: 0 0 14px rgba(201,168,76,0.8), 0 1px 4px rgba(0,0,0,1);
      line-height: 1.35;
    }

    /* Köşe işaretleri — hover'da beliriyor */
    .card-corner {
      position: absolute;
      width: 14px;
      height: 14px;
      z-index: 4;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .card-corner--tl { top: 5px; left: 5px; border-top: 1.5px solid var(--gold); border-left: 1.5px solid var(--gold); }
    .card-corner--tr { top: 5px; right: 5px; border-top: 1.5px solid var(--gold); border-right: 1.5px solid var(--gold); }
    .card-corner--bl { bottom: 5px; left: 5px; border-bottom: 1.5px solid var(--gold); border-left: 1.5px solid var(--gold); }
    .card-corner--br { bottom: 5px; right: 5px; border-bottom: 1.5px solid var(--gold); border-right: 1.5px solid var(--gold); }

    .character-card:hover .card-corner { opacity: 1; }

    /* ── BACK BUTTON ── */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--gold);
      text-decoration: none;
      border: 1px solid rgba(201,168,76,0.4);
      padding: 0.65rem 1.6rem;
      border-radius: 4px;
      background: rgba(10,8,6,0.7);
      transition: all 0.25s ease;
      animation: glowPulse 3s ease-in-out infinite;
    }
    .back-link:hover {
      background: rgba(201,168,76,0.12);
      border-color: var(--gold);
      box-shadow: 0 0 20px rgba(201,168,76,0.3);
      transform: translateY(-2px);
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      .character-card { width: 160px; }
      .character-grid { gap: 1.4rem; }
    }

    @media (max-width: 540px) {
      main { padding: 2rem 1rem 4rem; }
      h1 { letter-spacing: 3px; }
      .character-grid { gap: 1rem; }
      .character-card { width: calc(50% - 0.5rem); aspect-ratio: 3/4; }
      .character-name { font-size: 0.68rem; }
    }
  </style>
</head>
