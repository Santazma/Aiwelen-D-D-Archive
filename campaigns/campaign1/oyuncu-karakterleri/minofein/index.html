<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Minofein — Carpe Diem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root { --gold: #c9a84c; --gold-bright: #f5d080; --gold-dim: #ffdf6e; --dark-glass: rgba(0,0,0,0.62); }
    @keyframes pageFadeIn { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
    @keyframes titleDrop { from { opacity:0; transform:translateY(-30px) scale(0.95); letter-spacing:12px; } to { opacity:1; transform:translateY(0) scale(1); letter-spacing:3px; } }
    @keyframes glowPulse { 0%,100% { box-shadow:0 0 8px rgba(201,168,76,.35),0 0 20px rgba(201,168,76,.15); } 50% { box-shadow:0 0 16px rgba(201,168,76,.7),0 0 40px rgba(201,168,76,.3); } }
    @keyframes pulse { 0%,100% { opacity:.6; } 50% { opacity:1; } }
    *, *::before, *::after { box-sizing:border-box; }
    body { font-family:'Lora',Georgia,serif; margin:0; padding:0; min-height:100vh; background:linear-gradient(135deg,#0d0800 0%,#1a1000 40%,#0d0600 100%); color:#fff; display:flex; align-items:center; justify-content:center; }
    .fixed-back-button { position:fixed; top:20px; left:20px; z-index:999; padding:.45rem 1rem; font-family:'Cinzel',serif; font-size:.9rem; font-weight:700; letter-spacing:.5px; text-decoration:none; color:#fff; border-radius:8px; border:1px solid rgba(201,168,76,.45); background:linear-gradient(135deg,rgba(60,40,10,.82),rgba(30,18,5,.9)); box-shadow:0 0 8px rgba(201,168,76,.2); transition:transform .18s,box-shadow .25s; animation:glowPulse 3s ease-in-out infinite; }
    .fixed-back-button:hover { box-shadow:0 0 20px rgba(201,168,76,.6); transform:translateY(-2px); }
    .placeholder-container { text-align:center; padding:60px 30px; animation:pageFadeIn 1s ease .2s both; max-width:600px; }
    .placeholder-icon { font-size:5rem; margin-bottom:20px; animation:pulse 2.5s ease-in-out infinite; }
    h1 { font-family:'Cinzel',serif; font-size:clamp(2rem,6vw,3.5rem); font-weight:900; text-transform:uppercase; letter-spacing:3px; color:var(--gold-dim); text-shadow:0 0 30px rgba(201,168,76,.5),3px 3px 12px rgba(0,0,0,.9); margin:0 0 16px 0; animation:titleDrop 1s cubic-bezier(.22,1,.36,1) .1s both; }
    .subtitle { font-family:'Lora',Georgia,serif; font-style:italic; font-size:1.15rem; color:rgba(255,255,255,.65); margin-bottom:36px; letter-spacing:.5px; }
    .coming-soon-box { background:var(--dark-glass); border:1px solid rgba(201,168,76,.2); border-radius:14px; padding:30px 36px; margin-bottom:32px; box-shadow:0 4px 24px rgba(0,0,0,.6); }
    .coming-soon-box p { margin:0; font-size:1.05rem; line-height:1.7; color:rgba(255,255,255,.72); }
    .coming-soon-box strong { color:var(--gold); }
    .back-link { display:inline-block; padding:.65rem 1.6rem; font-family:'Cinzel',serif; font-size:1rem; font-weight:700; letter-spacing:1px; text-decoration:none; color:#fff; border-radius:8px; border:1px solid rgba(201,168,76,.5); background:linear-gradient(135deg,rgba(80,55,15,.75),rgba(35,22,5,.85)); box-shadow:0 0 10px rgba(201,168,76,.25); transition:transform .18s,box-shadow .25s; animation:glowPulse 3s ease-in-out infinite; }
    .back-link:hover { box-shadow:0 0 22px rgba(201,168,76,.65); transform:translateY(-2px); }
  </style>
</head>
<body>
  <a href="../index.html" class="fixed-back-button">⟵ Geri Dön</a>
  <div class="placeholder-container">
    <div class="placeholder-icon">🌑</div>
    <h1>Minofein</h1>
    <p class="subtitle">Carpe Diem — Campaign 1</p>
    <div class="coming-soon-box">
      <p>Bu karakterin sayfası henüz hazırlanmamıştır.<br><strong>Minofein</strong>'in hikâyesi yakında burada olacak.</p>
    </div>
    <a class="back-link" href="../index.html">← Karakter Listesine Dön</a>
  </div>
<script src="../../../../splash-cursor.js"></script>
</body>
</html>
