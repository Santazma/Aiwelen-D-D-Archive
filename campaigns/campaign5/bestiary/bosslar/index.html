<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bosslar — Campaign V Bestiary</title>
  <link rel="stylesheet" href="../../../../theme.css">
  <link rel="stylesheet" href="../../../../bestiary.css">
  <style>
    body {
      background-image: url('https://cdnb.artstation.com/p/assets/images/images/029/919/021/large/alessio-pontolillo-test3-snow.jpg?1599039414');
    }
    body::before {
      background:
        radial-gradient(ellipse at 50% 0%, rgba(20,40,70,0.45) 0%, transparent 60%),
        linear-gradient(180deg,
          rgba(4,6,10,0.92) 0%,
          rgba(6,10,18,0.78) 35%,
          rgba(6,10,18,0.82) 70%,
          rgba(4,6,10,0.96) 100%
        );
    }
  </style>
</head>
<body>
<main>

  <div class="page-eyebrow">Campaign V &mdash; Bestiary</div>
  <h1 class="page-title">Bosslar</h1>
  <div class="page-tagline">Kuzey'in karşısına çıkan başlıca düşmanlar</div>

  <div class="divider">
    <div class="divider-line"></div>
    <div class="divider-ornament">
      <div class="divider-dot"></div>
      <div class="divider-rune">❄</div>
      <div class="divider-dot"></div>
    </div>
    <div class="divider-line"></div>
  </div>

  <div class="creature-table-wrap">
    <div class="creature-table-head">
      <div class="th-cell"></div>
      <div class="th-cell sortable" data-sort="name">Name <span class="th-sort-arrow"></span></div>
      <div class="th-cell sortable" data-sort="type">Type <span class="th-sort-arrow"></span></div>
      <div class="th-cell sortable" data-sort="size">Size <span class="th-sort-arrow"></span></div>
      <div class="th-cell sortable" data-sort="cr">CR <span class="th-sort-arrow"></span></div>
    </div>

    <div class="creature-grid">

      <a class="creature-card is-boss" data-name="Koralith" data-type="Giant" data-size="Huge" data-cr="12" href="../koralith/index.html">
        <div class="creature-icon has-photo">
          <img src="../../campaignin-hikayesi/img/Koralith.jpg" alt="Koralith" onerror="this.style.visibility='hidden'">
        </div>
        <div class="creature-name">Koralith</div>
        <div class="creature-col-type">Giant</div>
        <div class="creature-col-size">Huge</div>
        <div class="cr-badge cr-badge--boss">CR 12<small>8,400 XP</small></div>
      </a>

      <a class="creature-card is-boss" data-name="Ophelia" data-type="Undead" data-size="Large" data-cr="17" href="../ophelia/index.html">
        <div class="creature-icon has-photo">
          <img src="../../campaignin-hikayesi/img/Ophelia Gerçek Formu.jpg" alt="Ophelia" onerror="this.style.visibility='hidden'">
        </div>
        <div class="creature-name">Ophelia</div>
        <div class="creature-col-type">Undead</div>
        <div class="creature-col-size">Large</div>
        <div class="cr-badge cr-badge--boss">CR 17<small>18,000 XP</small></div>
      </a>

    </div>
  </div>

  <a class="back-link" href="../index.html">← Bestiary'e Dön</a>

  <div class="footer-divider">
    <div class="divider-line"></div>
    <div class="divider-dot" style="width:4px;height:4px;background:rgba(201,168,76,0.3);transform:rotate(45deg);flex-shrink:0;"></div>
    <div class="divider-line"></div>
  </div>
  <div class="footer-text">Aiwelen Arşivleri &mdash; Campaign V Bestiary</div>

</main>
<script src="../../../../bestiary.js"></script>
<script src="../../../../splash-cursor.js"></script>
</body>
</html>
