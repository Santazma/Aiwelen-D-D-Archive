<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">

  <title>One Shots &amp; Short Campaigns | Aiwelen D&D</title>
  <link rel="stylesheet" href="../../theme.css">
  <style>
    body {
      background-image: url('https://cdnb.artstation.com/p/assets/images/images/085/193/785/large/edouard-noisette-cathedral-02-sunset.jpg?1740392958');
    }

    .emblem-wrap {
      position: relative;
      width: 104px; height: 104px;
      margin-bottom: 2rem;
    }
    .emblem-ring {
      position: absolute; inset: 0;
      animation: runeRotate 46s linear infinite;
    }
    .emblem-ring svg, .emblem-center svg { width: 100%; height: 100%; }
    .emblem-ring svg {
      opacity: 0.7;
      filter: drop-shadow(0 0 5px var(--gold-glow));
    }
    .emblem-center {
      position: absolute; inset: 26px;
      filter: drop-shadow(0 0 9px rgba(201,168,76,0.55));
      animation: flamePulse 4s ease-in-out infinite;
    }

    h1 {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(1.7rem, 5vw, 3.2rem);
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--gold-bright);
      margin: 0 0 0.4rem;
      line-height: 1.15;
      text-shadow:
        0 0 40px rgba(201,168,76,0.5),
        0 0 80px rgba(201,168,76,0.15),
        3px 3px 10px rgba(0,0,0,0.98);
      animation: titleDrop 1.4s cubic-bezier(.22,1,.36,1) 0.1s both;
    }

    .section-label {
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(201,168,76,0.35);
      margin-bottom: 1.4rem;
      animation: subtitleFade 1s ease 0.8s both;
    }

    @media (max-width: 540px) {
      .emblem-wrap { width: 82px; height: 82px; }
      .emblem-center { inset: 20px; }
      h1 { letter-spacing: 2px; }
    }
  </style>
</head>
