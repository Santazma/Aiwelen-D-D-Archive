<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aiwelen Map - D&D Haritası</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: #1a1a1a;
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }
        
        .map-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            cursor: grab;
        }
        
        .map-container:active {
            cursor: grabbing;
        }
        
        .map-image {
            position: absolute;
            width: 1920px;
            height: 1080px;
            background: url('aiwelen-map.jpg') no-repeat center center;
            background-size: contain;
            transform-origin: 0 0;
            transition: none;
        }
        
        .waypoint {
            position: absolute;
            width: 30px;
            height: 30px;
            background: #ff4444;
            border: 3px solid #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            color: #fff;
            cursor: pointer;
            z-index: 10;
            transform: translate(-50%, -50%);
            pointer-events: auto;
        }
        
        .route-line {
            position: absolute;
            height: 3px;
            background: #ff4444;
            z-index: 5;
            transform-origin: left center;
            pointer-events: none;
        }
        
        .controls-left {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid #333;
            z-index: 100;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        .control-group:last-child {
            margin-bottom: 0;
        }
        
        .control-label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: bold;
        }
        
        select {
            width: 200px;
            padding: 8px;
            border: 1px solid #555;
            border-radius: 5px;
            background: #333;
            color: #fff;
            font-size: 14px;
        }
        
        .zoom-controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }
        
        .zoom-btn {
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #333;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            transition: background 0.2s ease;
        }
        
        .zoom-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .details-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 300px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid #333;
            z-index: 100;
        }
        
        .details-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #ff4444;
        }
        
        .details-content {
            font-size: 14px;
            line-height: 1.5;
        }
        
        .distance-info {
            background: rgba(255, 68, 68, 0.1);
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            border-left: 3px solid #ff4444;
        }
        
        .clear-btn {
            background: #ff4444;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
            width: 100%;
        }
        
        .clear-btn:hover {
            background: #cc3333;
        }
    </style>
</head>
<body>
    <div class="map-container" id="mapContainer">
        <div class="map-image" id="mapImage"></div>
    </div>
    
    <div class="controls-left">
        <div class="control-group">
            <label class="control-label">Travel Speed</label>
            <select id="travelSpeed">
                <option value="30">Fast (30 mile/day)</option>
                <option value="24" selected>Normal (24 mile/day)</option>
                <option value="18">Slow (18 mile/day)</option>
            </select>
        </div>
        <div class="control-group">
            <label class="control-label">Terrain Difficulty</label>
            <select id="terrainDifficulty">
                <option value="1" selected>Normal Terrain</option>
                <option value="2">Difficult Terrain (x2)</option>
            </select>
        </div>
        <div class="control-group">
            <label class="control-label">Daily Travel Time</label>
            <select id="travelTime">
                <option value="2">2 Hours</option>
                <option value="4">4 Hours</option>
                <option value="6">6 Hours</option>
                <option value="8" selected>8 Hours</option>
                <option value="10">10 Hours</option>
                <option value="12">12 Hours</option>
            </select>
        </div>
    </div>
    
    <div class="zoom-controls">
        <button class="zoom-btn" id="zoomIn">+</button>
        <button class="zoom-btn" id="zoomOut">-</button>
    </div>
    
    <div class="details-panel">
        <div class="details-title">Route Details</div>
        <div class="details-content" id="detailsContent">
            Click on the map to start planning your route...
        </div>
    </div>

    <script>
        class MapApp {
            constructor() {
                this.mapContainer = document.getElementById('mapContainer');
                this.mapImage = document.getElementById('mapImage');
                this.detailsContent = document.getElementById('detailsContent');
                this.travelSpeedSelect = document.getElementById('travelSpeed');
                this.terrainDifficultySelect = document.getElementById('terrainDifficulty');
                this.travelTimeSelect = document.getElementById('travelTime');
                
                // Map properties
                this.mapWidth = 1920;
                this.mapHeight = 1080;
                this.minZoom = 0.3;
                this.maxZoom = 3;
                this.zoom = 0.8;
                this.panX = 0;
                this.panY = 0;
                
                // Waypoints
                this.waypoints = [];
                this.waypointCounter = 0;
                
                // Dragging
                this.isDragging = false;
                this.dragStartX = 0;
                this.dragStartY = 0;
                this.lastPanX = 0;
                this.lastPanY = 0;
                
                this.init();
            }
            
            init() {
                this.centerMap();
                this.initEventListeners();
                this.updateMapTransform();
                this.updateDetails();
            }
            
            centerMap() {
                const containerWidth = this.mapContainer.clientWidth;
                const containerHeight = this.mapContainer.clientHeight;
                
                // Haritayı ekranın ortasında konumlandır
                this.panX = (containerWidth - this.mapWidth * this.zoom) / 2;
                this.panY = (containerHeight - this.mapHeight * this.zoom) / 2;
            }
            
            initEventListeners() {
                // Map click for waypoints
                this.mapContainer.addEventListener('click', (e) => {
                    if (!this.isDragging) {
                        this.addWaypoint(e);
                    }
                });
                
                // Mouse down - start dragging
                this.mapContainer.addEventListener('mousedown', (e) => {
                    if (e.target.classList.contains('waypoint')) return;
                    
                    this.isDragging = false;
                    this.dragStartX = e.clientX;
                    this.dragStartY = e.clientY;
                    this.lastPanX = this.panX;
                    this.lastPanY = this.panY;
                    
                    e.preventDefault();
                });
                
                // Mouse move - handle dragging
                this.mapContainer.addEventListener('mousemove', (e) => {
                    if (e.buttons === 1) {
                        const deltaX = e.clientX - this.dragStartX;
                        const deltaY = e.clientY - this.dragStartY;
                        
                        // Reduced sensitivity for slower panning
                        const sensitivity = 0.8;
                        
                        if (Math.abs(deltaX) > 3 || Math.abs(deltaY) > 3) {
                            this.isDragging = true;
                            this.panX = this.lastPanX + (deltaX * sensitivity);
                            this.panY = this.lastPanY + (deltaY * sensitivity);
                            
                            this.constrainPan();
                            this.updateMapTransform();
                        }
                    }
                });
                
                // Mouse up - stop dragging
                window.addEventListener('mouseup', () => {
                    if (this.isDragging) {
                        setTimeout(() => {
                            this.isDragging = false;
                        }, 50);
                    }
                });
                
                // Zoom controls
                document.getElementById('zoomIn').addEventListener('click', () => {
                    this.zoomAtCenter(0.2);
                });
                
                document.getElementById('zoomOut').addEventListener('click', () => {
                    this.zoomAtCenter(-0.2);
                });
                
                // Mouse wheel zoom
                this.mapContainer.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    
                    const rect = this.mapContainer.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left;
                    const mouseY = e.clientY - rect.top;
                    
                    const delta = e.deltaY > 0 ? -0.1 : 0.1;
                    this.zoomAtPoint(mouseX, mouseY, delta);
                });
                
                // Settings change listeners
                this.travelSpeedSelect.addEventListener('change', () => this.updateDetails());
                this.terrainDifficultySelect.addEventListener('change', () => this.updateDetails());
                this.travelTimeSelect.addEventListener('change', () => this.updateDetails());
            }
            
            zoomAtCenter(zoomDelta) {
                const centerX = this.mapContainer.clientWidth / 2;
                const centerY = this.mapContainer.clientHeight / 2;
                this.zoomAtPoint(centerX, centerY, zoomDelta);
            }
            
            zoomAtPoint(screenX, screenY, zoomDelta) {
                const oldZoom = this.zoom;
                const newZoom = Math.max(this.minZoom, Math.min(this.maxZoom, this.zoom + zoomDelta));
                
                if (newZoom !== oldZoom) {
                    // Calculate the point on the map that should stay fixed
                    const mapX = (screenX - this.panX) / oldZoom;
                    const mapY = (screenY - this.panY) / oldZoom;
                    
                    // Update zoom
                    this.zoom = newZoom;
                    
                    // Adjust pan to keep the point fixed
                    this.panX = screenX - mapX * this.zoom;
                    this.panY = screenY - mapY * this.zoom;
                    
                    this.constrainPan();
                    this.updateMapTransform();
                }
            }
            
            constrainPan() {
                const containerWidth = this.mapContainer.clientWidth;
                const containerHeight = this.mapContainer.clientHeight;
                const mapDisplayWidth = this.mapWidth * this.zoom;
                const mapDisplayHeight = this.mapHeight * this.zoom;
                
                // Allow some overscroll but not too much
                const maxOverscroll = 100;
                
                this.panX = Math.max(-mapDisplayWidth - maxOverscroll, 
                           Math.min(containerWidth + maxOverscroll, this.panX));
                this.panY = Math.max(-mapDisplayHeight - maxOverscroll, 
                           Math.min(containerHeight + maxOverscroll, this.panY));
            }
            
            updateMapTransform() {
                this.mapImage.style.transform = `translate(${this.panX}px, ${this.panY}px) scale(${this.zoom})`;
                this.updateWaypointPositions();
                this.drawRoutes();
            }
            
            addWaypoint(e) {
                const rect = this.mapContainer.getBoundingClientRect();
                const screenX = e.clientX - rect.left;
                const screenY = e.clientY - rect.top;
                
                // Convert screen coordinates to map coordinates
                const mapX = (screenX - this.panX) / this.zoom;
                const mapY = (screenY - this.panY) / this.zoom;
                
                // Check if coordinates are within map bounds
                if (mapX < 0 || mapX > this.mapWidth || mapY < 0 || mapY > this.mapHeight) {
                    return;
                }
                
                const waypoint = {
                    id: ++this.waypointCounter,
                    mapX: mapX,
                    mapY: mapY,
                    element: null
                };
                
                // Create waypoint element
                const waypointEl = document.createElement('div');
                waypointEl.className = 'waypoint';
                waypointEl.textContent = this.waypoints.length + 1;
                
                // Add click handler for removal
                waypointEl.addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.removeWaypoint(waypoint.id);
                });
                
                waypoint.element = waypointEl;
                this.mapContainer.appendChild(waypointEl);
                this.waypoints.push(waypoint);
                
                this.updateWaypointPositions();
                this.drawRoutes();
                this.updateDetails();
            }
            
            removeWaypoint(id) {
                const index = this.waypoints.findIndex(w => w.id === id);
                if (index !== -1) {
                    this.waypoints[index].element.remove();
                    this.waypoints.splice(index, 1);
                    
                    // Renumber waypoints
                    this.waypoints.forEach((waypoint, i) => {
                        waypoint.element.textContent = i + 1;
                    });
                    
                    this.drawRoutes();
                    this.updateDetails();
                }
            }
            
            updateWaypointPositions() {
                this.waypoints.forEach(waypoint => {
                    const screenX = waypoint.mapX * this.zoom + this.panX;
                    const screenY = waypoint.mapY * this.zoom + this.panY;
                    
                    waypoint.element.style.left = screenX + 'px';
                    waypoint.element.style.top = screenY + 'px';
                });
            }
            
            drawRoutes() {
                // Remove old route lines
                const oldLines = this.mapContainer.querySelectorAll('.route-line');
                oldLines.forEach(line => line.remove());
                
                // Draw new route lines
                for (let i = 0; i < this.waypoints.length - 1; i++) {
                    const start = this.waypoints[i];
                    const end = this.waypoints[i + 1];
                    
                    const startX = start.mapX * this.zoom + this.panX;
                    const startY = start.mapY * this.zoom + this.panY;
                    const endX = end.mapX * this.zoom + this.panX;
                    const endY = end.mapY * this.zoom + this.panY;
                    
                    const distance = Math.sqrt(Math.pow(endX - startX, 2) + Math.pow(endY - startY, 2));
                    const angle = Math.atan2(endY - startY, endX - startX) * 180 / Math.PI;
                    
                    const line = document.createElement('div');
                    line.className = 'route-line';
                    line.style.left = startX + 'px';
                    line.style.top = startY + 'px';
                    line.style.width = distance + 'px';
                    line.style.transform = `rotate(${angle}deg)`;
                    
                    this.mapContainer.appendChild(line);
                }
            }
            
            calculateTotalDistance() {
                let totalDistance = 0;
                for (let i = 0; i < this.waypoints.length - 1; i++) {
                    const start = this.waypoints[i];
                    const end = this.waypoints[i + 1];
                    const distance = Math.sqrt(Math.pow(end.mapX - start.mapX, 2) + Math.pow(end.mapY - start.mapY, 2));
                    totalDistance += distance;
                }
                
                // Convert pixels to miles (adjusted for your map scale)
                const milesPerPixel = 1.0;
                return totalDistance * milesPerPixel;
            }
            
            updateDetails() {
                if (this.waypoints.length === 0) {
                    this.detailsContent.innerHTML = 'Click on the map to start planning your route...';
                } else if (this.waypoints.length === 1) {
                    this.detailsContent.innerHTML = 'Add a second point to create a route...';
                } else {
                    const totalMiles = this.calculateTotalDistance();
                    const travelSpeed = parseInt(this.travelSpeedSelect.value);
                    const terrainMultiplier = parseInt(this.terrainDifficultySelect.value);
                    const dailyHours = parseInt(this.travelTimeSelect.value);
                    const adjustedMiles = totalMiles * terrainMultiplier;
                    
                    // Calculate daily distance based on hours traveled
                    const dailyMiles = (travelSpeed / 8) * dailyHours; // 8 hours = standard travel day
                    const totalDays = adjustedMiles / dailyMiles;
                    
                    const fullDays = Math.floor(totalDays);
                    const extraHours = Math.round((totalDays - fullDays) * dailyHours);
                    
                    let timeText = '';
                    if (fullDays > 0) {
                        timeText = `${fullDays} day${fullDays !== 1 ? 's' : ''}`;
                        if (extraHours > 0) {
                            timeText += ` and ${extraHours} hour${extraHours !== 1 ? 's' : ''}`;
                        }
                    } else {
                        timeText = `${extraHours} hour${extraHours !== 1 ? 's' : ''}`;
                    }
                    
                    this.detailsContent.innerHTML = `
                        <div class="distance-info">
                            <strong>Route Summary:</strong><br>
                            Distance: ${totalMiles.toFixed(1)} miles<br>
                            Adjusted Distance: ${adjustedMiles.toFixed(1)} miles<br>
                            Travel Time: ${timeText}
                        </div>
                        <div>
                            <strong>Waypoints:</strong> ${this.waypoints.length}<br>
                            <strong>Travel Speed:</strong> ${travelSpeed} miles/day<br>
                            <strong>Daily Hours:</strong> ${dailyHours} hours/day<br>
                            <strong>Terrain:</strong> ${terrainMultiplier}x difficulty
                        </div>
                        <button class="clear-btn" onclick="mapApp.clearAll()">Clear All Waypoints</button>
                    `;
                }
            }
            
            clearAll() {
                this.waypoints.forEach(waypoint => waypoint.element.remove());
                const lines = this.mapContainer.querySelectorAll('.route-line');
                lines.forEach(line => line.remove());
                
                this.waypoints = [];
                this.waypointCounter = 0;
                this.updateDetails();
            }
        }
        
        // Initialize the map application
        const mapApp = new MapApp();
    </script>
<script src="../../splash-cursor.js"></script>
</body>
</html>
