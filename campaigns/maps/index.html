        drawRoutes() {
            this.routeSvg.innerHTML = '';
            this.viewport.querySelectorAll('.leg-label').forEach(l => l.remove());

            for (let i = 0; i < this.waypoints.length - 1; i++) {
                const a = this.toScreen(this.waypoints[i].mapX, this.waypoints[i].mapY);
                const b = this.toScreen(this.waypoints[i + 1].mapX, this.waypoints[i + 1].mapY);
                const leg = this.legs[i];
                const difficult = leg && leg.terrain > 1;
                const hl = i === this.highlightedLeg;

                const glow = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                glow.setAttribute('x1', a.x); glow.setAttribute('y1', a.y);
                glow.setAttribute('x2', b.x); glow.setAttribute('y2', b.y);
                glow.setAttribute('class',
                    'route-glow' + (difficult ? ' difficult' : '') + (hl ? ' highlighted' : ''));
                this.routeSvg.appendChild(glow);

                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
                line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
                line.setAttribute('class',
                    'route-path' + (difficult ? ' difficult' : '') + (hl ? ' highlighted' : ''));
                this.routeSvg.appendChild(line);

                const miles = this.legRawMiles(i);
                const label = document.createElement('div');
                label.className = 'leg-label' + (difficult ? ' difficult' : '');
                label.textContent = this.fmt(miles) + ' mil';
                label.style.left = ((a.x + b.x) / 2) + 'px';
                label.style.top = ((a.y + b.y) / 2 - 14) + 'px';
                this.viewport.appendChild(label);
            }

            this.drawMeasure();
        }

        drawMeasure() {
            if (!this.measure) return;
            const a = this.toScreen(this.measure.a.x, this.measure.a.y);
            const b = this.toScreen(this.measure.b.x, this.measure.b.y);

            const glow = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            glow.setAttribute('x1', a.x); glow.setAttribute('y1', a.y);
            glow.setAttribute('x2', b.x); glow.setAttribute('y2', b.y);
            glow.setAttribute('class', 'measure-glow');
            this.routeSvg.appendChild(glow);

            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
            line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
            line.setAttribute('class', 'measure-line');
            this.routeSvg.appendChild(line);

            [a, b].forEach(p => {
                const cap = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                cap.setAttribute('cx', p.x); cap.setAttribute('cy', p.y);
                cap.setAttribute('r', 4.5);
                cap.setAttribute('class', 'measure-cap');
                this.routeSvg.appendChild(cap);
            });

            const miles = Math.hypot(this.measure.b.x - this.measure.a.x,
                this.measure.b.y - this.measure.a.y) * this.milesPerPixel;
            const label = document.createElement('div');
            label.className = 'leg-label measure';
            label.textContent = this.fmt(miles) + ' mil';
            label.style.left = ((a.x + b.x) / 2) + 'px';
            label.style.top = ((a.y + b.y) / 2 - 18) + 'px';
            this.viewport.appendChild(label);
        }

        setHighlight(i) {
            if (this.highlightedLeg === i) return;
            this.highlightedLeg = i;
            this.drawRoutes();
        }

        /* ═══════════ HESAPLAMALAR ═══════════
           Ölçek: 1 piksel (harita koordinatı) = milesPerPixel mil.
           mil/saat = pace / 8 · etap saat = (mesafe × terrain) / (mil/saat)
           etap gün = etap saat / o etabın günlük yol saati */

        legRawMiles(i) {
            const a = this.waypoints[i], b = this.waypoints[i + 1];
            const px = Math.hypot(b.mapX - a.mapX, b.mapY - a.mapY);
            return px * this.milesPerPixel;
        }

        legStats(i) {
            const leg = this.legs[i];
            const rawMiles = this.legRawMiles(i);
            const effMiles = rawMiles * leg.terrain;
            const mph = leg.pace / 8;
            const hours = effMiles / mph;
            const dayUnits = hours / leg.dailyHours;
            return { rawMiles, effMiles, hours, dayUnits };
        }

        fmt(n) {
            const r = Math.round(n * 10) / 10;
            return Number.isInteger(r) ? String(r) : r.toFixed(1);
        }

        formatJourney(totalDayUnits) {
            if (this.legs.length === 0) return '—';
            const lastDaily = this.legs[this.legs.length - 1].dailyHours;
            let fullDays = Math.floor(totalDayUnits + 1e-9);
            let extraHours = Math.round((totalDayUnits - fullDays) * lastDaily * 10) / 10;
            if (extraHours >= lastDaily) { fullDays += 1; extraHours = 0; }
            if (fullDays === 0) return this.fmt(extraHours) + ' saat (tek günde)';
            let out = fullDays + ' gün';
            if (extraHours > 0) out += ' ' + this.fmt(extraHours) + ' saat';
            return out;
        }

    /* ═══════════ ROTA DETAY PANELİ ═══════════ */

        updateDetails() {
            if (this.waypoints.length === 0) {
                this.detailsContent.innerHTML = `
                    <div class="empty-state">
                        Rota oluşturmak için haritaya tıklayarak noktalar ekle.
                        <span class="hint">Nokta taşı: sürükle · Nokta sil: tıkla ·
                        Geri al: Ctrl+Z · Cetvel: M</span>
                    </div>`;
                return;
            }
            if (this.waypoints.length === 1) {
                this.detailsContent.innerHTML = `
                    <div class="empty-state">
                        Rota oluşturmak için ikinci bir nokta ekle...
                    </div>
                    <div class="btn-row">
                        <button class="btn btn-danger" id="clearBtn">Rotayı Temizle</button>
                    </div>`;
                document.getElementById('clearBtn')
                    .addEventListener('click', () => this.confirmClearRoute());
                return;
            }

            let totRaw = 0, totEff = 0, totHours = 0, totDayUnits = 0;
            const stats = [];
            for (let i = 0; i < this.legs.length; i++) {
                const s = this.legStats(i);
                stats.push(s);
                totRaw += s.rawMiles;
                totEff += s.effMiles;
                totHours += s.hours;
                totDayUnits += s.dayUnits;
            }

            const arriveOffset = Math.max(0, Math.ceil(totDayUnits - 1e-9) - 1);
            const arrival = calAddDays(this.profile.calendar, arriveOffset);

            const uniformSettings = this.legs.every(l =>
                l.pace === this.legs[0].pace &&
                l.terrain === this.legs[0].terrain &&
                l.dailyHours === this.legs[0].dailyHours);

            let html = `
                <div class="summary-box">
                    <div class="summary-row">
                        <span class="s-label">Mesafe</span>
                        <span class="s-value">${this.fmt(totRaw)} mil</span>
                    </div>
                    ${totEff > totRaw + 0.05 ? `
                    <div class="summary-row">
                        <span class="s-label">Efektif Mesafe</span>
                        <span class="s-value">${this.fmt(totEff)} mil</span>
                    </div>` : ''}
                    <div class="summary-sep"></div>
                    <div class="summary-row main">
                        <span class="s-label">Yol Süresi</span>
                        <span class="s-value">${this.fmt(totHours)} saat</span>
                    </div>
                    <div class="summary-row main">
                        <span class="s-label">Yolculuk</span>
                        <span class="s-value">${this.formatJourney(totDayUnits)}</span>
                    </div>
                    <div class="summary-row">
                        <span class="s-label">Varış</span>
                        <span class="s-value">${calFormatTr(arrival)}</span>
                    </div>
                    <div class="summary-sep"></div>
                    <div class="summary-row">
                        <span class="s-label">Nokta / Etap</span>
                        <span class="s-value">${this.waypoints.length} / ${this.legs.length}</span>
                    </div>
                </div>
                <div class="legs-title">Etaplar${uniformSettings ? '' : ' — karışık ayarlar'}</div>`;

            for (let i = 0; i < this.legs.length; i++) {
                const leg = this.legs[i];
                const s = stats[i];
                html += `
                <div class="leg-row" data-leg="${i}" style="animation-delay:${i * 0.05}s">
                    <div class="leg-head">
                        <span class="leg-name">${i + 1} → ${i + 2}</span>
                        <span class="leg-stats">
                            <b>${this.fmt(s.rawMiles)} mil</b>${leg.terrain > 1 ? ' (×' + leg.terrain + ' = ' + this.fmt(s.effMiles) + ')' : ''}<br>
                            ${this.fmt(s.hours)} saat · ${this.fmt(s.dayUnits)} gün
                        </span>
                    </div>
                    <div class="leg-controls">
                        <div>
                            <span class="mini-label">Pace</span>
                            <select data-leg="${i}" data-key="pace">
                                <option value="30" ${leg.pace === 30 ? 'selected' : ''}>Fast 30</option>
                                <option value="24" ${leg.pace === 24 ? 'selected' : ''}>Normal 24</option>
                                <option value="18" ${leg.pace === 18 ? 'selected' : ''}>Slow 18</option>
                            </select>
                        </div>
                        <div>
                            <span class="mini-label">Terrain</span>
                            <select data-leg="${i}" data-key="terrain">
                                <option value="1" ${leg.terrain === 1 ? 'selected' : ''}>Normal</option>
                                <option value="2" ${leg.terrain === 2 ? 'selected' : ''}>Difficult</option>
                            </select>
                        </div>
                        <div>
                            <span class="mini-label">Saat/Gün</span>
                            <select data-leg="${i}" data-key="dailyHours">
                                ${[2,4,6,8,10,12].map(h =>
                                    `<option value="${h}" ${leg.dailyHours === h ? 'selected' : ''}>${h} saat</option>`
                                ).join('')}
                            </select>
                        </div>
                    </div>
                </div>`;
            }

            html += `
                <div class="btn-row">
                    <button class="btn" id="undoBtn" title="Ctrl+Z">Son Noktayı Sil</button>
                    <button class="btn btn-danger" id="clearBtn">Rotayı Temizle</button>
                </div>
                <div class="btn-row">
                    <button class="btn" id="shareRouteBtn" title="Bu rotayı kısa bir link olarak kopyala">Rota Linkini Kopyala</button>
                </div>`;

            this.detailsContent.innerHTML = html;

            this.detailsContent.querySelectorAll('.leg-controls select').forEach(sel => {
                sel.addEventListener('change', () => {
                    const leg = this.legs[parseInt(sel.dataset.leg)];
                    leg[sel.dataset.key] = parseInt(sel.value);
                    this.saveRoute();
                    this.drawRoutes();
                    this.updateDetails();
                });
            });
            this.detailsContent.querySelectorAll('.leg-row').forEach(row => {
                row.addEventListener('mouseenter', () => this.setHighlight(parseInt(row.dataset.leg)));
                row.addEventListener('mouseleave', () => this.setHighlight(-1));
            });
            document.getElementById('undoBtn').addEventListener('click', () => this.removeLastWaypoint());
            document.getElementById('clearBtn').addEventListener('click', () => this.confirmClearRoute());
            document.getElementById('shareRouteBtn').addEventListener('click', () => this.shareRouteLink());
        }

        confirmClearRoute() {
            this.showConfirm('Mevcut rota silinecek. Emin misin?', () => {
                this.clearAll();
                this.showToast('Rota temizlendi');
            });
        }

        /* ═══════════ POI SİSTEMİ ═══════════ */

        allPois() {
            return BASE_POIS.concat(this.profile.customPois);
        }

        findPoi(id) {
            return this.allPois().find(p => p.id === id) || null;
        }

        isCustomPoi(id) {
            return this.profile.customPois.some(p => p.id === id);
        }

        getPoiData(id) {
            if (!this.profile.pois[id]) {
                this.profile.pois[id] = { info: '', notes: '', images: [] };
            }
            const d = this.profile.pois[id];
            if (!Array.isArray(d.images)) d.images = [];
            return d;
        }

        renderPoiMarkers() {
            this.poiMarkers.forEach(el => el.remove());
            this.poiMarkers.clear();
            this.allPois().forEach(poi => {
                const el = document.createElement('div');
                const custom = this.isCustomPoi(poi.id);
                el.className = 'poi' + (custom ? ' custom' : '');
                el.innerHTML = `<div class="poi-diamond"></div><div class="poi-label"></div>`;
                const label = el.querySelector('.poi-label');
                label.textContent = poi.name;
                // İngilizce özel adlarda TR locale "i→İ" büyütmesini engelle
                if (!custom) label.setAttribute('lang', 'en');
                el.addEventListener('pointerdown', (e) => {
                    if (e.button !== undefined && e.button !== 0) return;
                    e.stopPropagation();
                    e.preventDefault();
                    this.cancelFly();
                    this.poiDrag = { poi, startX: e.clientX, startY: e.clientY, moved: false };
                    try { this.viewport.setPointerCapture(e.pointerId); } catch (err) {}
                });
                this.viewport.appendChild(el);
                this.poiMarkers.set(poi.id, el);
            });
            this.updatePoiPositions();
            this.updatePoiActiveState();
        }

        movePoiDrag(e) {
            const d = this.poiDrag;
            if (!d.moved &&
                Math.abs(e.clientX - d.startX) < 5 && Math.abs(e.clientY - d.startY) < 5) return;
            if (!this.isCustomPoi(d.poi.id)) return; // sabit POI'ler taşınamaz
            d.moved = true;
            const rect = this.viewport.getBoundingClientRect();
            const m = this.toMap(e.clientX - rect.left, e.clientY - rect.top);
            d.poi.x = Math.max(0, Math.min(this.mapWidth, m.x));
            d.poi.y = Math.max(0, Math.min(this.mapHeight, m.y));
            this.updatePoiPositions();
        }

        endPoiDrag() {
            const d = this.poiDrag;
            this.poiDrag = null;
            if (d.moved) {
                this.saveProfile();
                this.showToast('POI taşındı');
            } else {
                this.selectPoi(d.poi.id);
            }
        }

        updatePoiPositions() {
            this.poiMarkers.forEach((el, id) => {
                const poi = this.findPoi(id);
                if (!poi) return;
                const s = this.toScreen(poi.x, poi.y);
                el.style.left = s.x + 'px';
                el.style.top = s.y + 'px';
            });
        }

        updatePoiActiveState() {
            this.poiMarkers.forEach((el, id) => {
                el.classList.toggle('active', id === this.selectedPoiId);
            });
            this.locationsBody.querySelectorAll('.loc-row').forEach(row => {
                row.classList.toggle('active', row.dataset.poi === this.selectedPoiId);
            });
        }

        selectPoi(id, opts) {
            const poi = this.findPoi(id);
            if (!poi) return;
            this.selectedPoiId = id;
            this.updatePoiActiveState();
            this.openPoiPanel(poi);
            if (!opts || opts.fly !== false) this.flyTo(poi.x, poi.y, 1.5);
        }

        openPoiPanel(poi) {
            document.getElementById('rightCol').classList.add('slid-out');
            const panel = document.getElementById('poiPanel');
            this.renderPoiPanel(poi);
            panel.classList.add('open');
        }

        closePoiPanel() {
            this.selectedPoiId = null;
            document.getElementById('poiPanel').classList.remove('open');
            document.getElementById('rightCol').classList.remove('slid-out');
            this.updatePoiActiveState();
        }

        /* ── Lokasyon listesi (sol panel) ── */

        renderLocationsList() {
            const pois = this.allPois()
                .slice()
                .sort((a, b) => a.name.localeCompare(b.name, 'tr'))
                .filter(p => !this.locFilter ||
                    p.name.toLocaleLowerCase('tr').includes(this.locFilter));

            let html = `
                <div class="loc-toolbar">
                    <input class="text-input" id="locSearch" type="text" placeholder="Ara...">
                    <button class="loc-add-btn${this.placingPoi ? ' armed' : ''}" id="addPoiBtn"
                        title="Yeni POI ekle: butona bas, sonra haritada bir yere tıkla">+</button>
                </div>`;
            if (pois.length === 0) {
                html += `<div class="loc-empty">Sonuç yok...</div>`;
            }
            pois.forEach(p => {
                const custom = this.isCustomPoi(p.id);
                html += `
                <div class="loc-row${custom ? ' custom' : ''}" data-poi="${p.id}">
                    <span class="loc-diamond"></span>
                    <span class="loc-name"${custom ? '' : ' lang="en"'}></span>
                    <span class="loc-type">${POI_TYPES[p.type] || ''}</span>
                </div>`;
            });
            this.locationsBody.innerHTML = html;

            const rows = this.locationsBody.querySelectorAll('.loc-row');
            let ri = 0;
            pois.forEach(p => {
                const row = rows[ri++];
                row.querySelector('.loc-name').textContent = p.name;
                row.addEventListener('click', () => this.selectPoi(p.id));
            });

            const search = document.getElementById('locSearch');
            search.value = this.locFilter;
            search.addEventListener('input', () => {
                this.locFilter = search.value.trim().toLocaleLowerCase('tr');
                const keep = document.activeElement === search;
                this.renderLocationsList();
                if (keep) {
                    const s2 = document.getElementById('locSearch');
                    s2.focus();
                    s2.setSelectionRange(s2.value.length, s2.value.length);
                }
            });
            document.getElementById('addPoiBtn').addEventListener('click', () =>
                this.setPlacingMode(!this.placingPoi));
            this.updatePoiActiveState();
        }

        setPlacingMode(on) {
            this.placingPoi = on;
            this.viewport.classList.toggle('placing', on);
            const btn = document.getElementById('addPoiBtn');
            if (btn) btn.classList.toggle('armed', on);
            if (on) {
                this.setMeasuring(false);
                this.showToast('Haritada bir yere tıkla — İptal: Esc');
            }
        }

        finishPoiPlacement(screenX, screenY) {
            const m = this.toMap(screenX, screenY);
            this.setPlacingMode(false);
            if (m.x < 0 || m.x > this.mapWidth || m.y < 0 || m.y > this.mapHeight) return;
            const poi = {
                id: 'c' + Date.now(),
                name: 'Yeni Lokasyon',
                type: 'ozel',
                x: Math.round(m.x), y: Math.round(m.y)
            };
            this.profile.customPois.push(poi);
            this.saveProfile();
            this.renderPoiMarkers();
            this.renderLocationsList();
            this.selectPoi(poi.id, { fly: false });
            this.showToast('POI eklendi — ismini panelden düzenle');
        }

        /* ── POI paneli içeriği (LoL tarzı) ── */

        renderPoiPanel(poi) {
            const content = document.getElementById('poiPanelContent');
            const data = this.getPoiData(poi.id);
            const custom = this.isCustomPoi(poi.id);
            const typeLabel = POI_TYPES[poi.type] || '';

            let html = `
                <div class="poi-eyebrow poi-fade" style="animation-delay:0.08s">${typeLabel} — <span lang="en">Aiwelen</span></div>
                ${custom
                    ? `<input class="text-input poi-title-input poi-fade" id="poiNameInput" type="text"
                         maxlength="50" style="animation-delay:0.14s">`
                    : `<h2 class="poi-title poi-fade" id="poiTitle" lang="en" style="animation-delay:0.14s"></h2>`}
                <div class="poi-ornament poi-fade" style="animation-delay:0.2s">
                    <div class="orn-line rev"></div>
                    <div class="orn-diamond"></div>
                    <div class="orn-line"></div>
                </div>
                <div id="dmHeroWrap" class="poi-fade" style="animation-delay:0.26s"></div>
                <div class="poi-gallery poi-fade" id="dmGallery" style="animation-delay:0.3s"></div>
                <div class="poi-section-title poi-fade" style="animation-delay:0.36s">Bilgi</div>
                ${custom
                    ? `<textarea class="text-input poi-fade" id="poiInfoInput" style="animation-delay:0.4s"
                         placeholder="Bu yer hakkında bilgi yaz..."></textarea>`
                    : `<div class="poi-info-text poi-fade" id="poiInfoText" style="animation-delay:0.4s"></div>`}
                <div class="poi-section-title poi-fade" style="animation-delay:0.46s">Galerim</div>
                <div class="poi-gallery poi-fade" id="playerGallery" style="animation-delay:0.5s"></div>
                <div class="poi-section-title poi-fade" style="animation-delay:0.56s">Notlarım</div>
                <textarea class="text-input poi-fade" id="poiNotesInput" style="animation-delay:0.6s"
                    placeholder="Kişisel notların... (görevler, ipuçları, planlar)"></textarea>
                <div class="btn-row poi-fade" style="animation-delay:0.66s">
                    <button class="btn" id="poiAddRouteBtn">Rotaya Ekle</button>
                    ${custom ? `<button class="btn btn-danger" id="poiDeleteBtn">POI'yi Sil</button>` : ''}
                </div>`;

            content.innerHTML = html;

            if (custom) {
                const nameInput = document.getElementById('poiNameInput');
                nameInput.value = poi.name;
                nameInput.addEventListener('input', () => {
                    poi.name = nameInput.value || 'İsimsiz';
                    const marker = this.poiMarkers.get(poi.id);
                    if (marker) marker.querySelector('.poi-label').textContent = poi.name;
                    this.debouncedProfileSave();
                });
                nameInput.addEventListener('blur', () => this.renderLocationsList());
                document.getElementById('poiDeleteBtn').addEventListener('click', () => {
                    this.showConfirm(`"${poi.name}" POI'si ve notları silinecek. Emin misin?`, () => {
                        this.profile.customPois = this.profile.customPois.filter(p => p.id !== poi.id);
                        delete this.profile.pois[poi.id];
                        this.saveProfile();
                        this.renderPoiMarkers();
                        this.renderLocationsList();
                        this.closePoiPanel();
                        this.showToast('POI silindi');
                    });
                });
                const infoInput = document.getElementById('poiInfoInput');
                infoInput.value = data.info || '';
                infoInput.addEventListener('input', () => {
                    data.info = infoInput.value;
                    this.debouncedProfileSave();
                });
            } else {
                document.getElementById('poiTitle').textContent = poi.name;
                const infoText = document.getElementById('poiInfoText');
                if (poi.info && poi.info.trim()) {
                    infoText.textContent = poi.info;
                } else {
                    infoText.textContent = 'Bu yer hakkında henüz kayıtlı bilgi yok. Arşiv yazıcıları çalışıyor...';
                    infoText.classList.add('empty');
                }
            }

            document.getElementById('poiAddRouteBtn').addEventListener('click', () => {
                this.addWaypointAtMap(poi.x, poi.y);
                this.showToast('Rotaya eklendi: ' + poi.name);
            });

            const notesInput = document.getElementById('poiNotesInput');
            notesInput.value = data.notes || '';
            notesInput.addEventListener('input', () => {
                data.notes = notesInput.value;
                this.debouncedProfileSave();
            });

            this.renderGallery(poi.id);
        }

        renderGallery(poiId) {
            const dmGallery = document.getElementById('dmGallery');
            const heroWrap = document.getElementById('dmHeroWrap');
            const playerGallery = document.getElementById('playerGallery');
            if (!playerGallery || this.selectedPoiId !== poiId) return;

            // ── DM arşiv görselleri (salt görüntüleme, kodda DM_IMAGES'ten gelir) ──
            const dmImages = DM_IMAGES[poiId] || [];
            heroWrap.innerHTML = '';
            dmGallery.innerHTML = '';
            dmGallery.style.display = dmImages.length > 1 ? '' : 'none';
            if (dmImages.length > 0) {
                const hero = document.createElement('div');
                hero.className = 'poi-hero';
                const img = document.createElement('img');
                img.src = dmImages[0];
                img.alt = '';
                img.onerror = () => hero.remove();
                hero.appendChild(img);
                hero.addEventListener('click', () => this.openSimpleLightbox(dmImages, 0));
                heroWrap.appendChild(hero);

                dmImages.forEach((src, i) => {
                    if (i === 0) return; // kapakta gösteriliyor
                    const thumb = document.createElement('div');
                    thumb.className = 'poi-thumb';
                    const im = document.createElement('img');
                    im.src = src;
                    im.alt = '';
                    im.onerror = () => thumb.remove();
                    thumb.appendChild(im);
                    thumb.addEventListener('click', () => this.openSimpleLightbox(dmImages, i));
                    dmGallery.appendChild(thumb);
                });
            }

            // ── Oyuncu galerisi (yüklenebilir, isim + not düzenlenebilir) ──
            const data = this.getPoiData(poiId);
            playerGallery.innerHTML = '';
            data.images.forEach((im, i) => {
                const thumb = document.createElement('div');
                thumb.className = 'poi-thumb';
                thumb.title = im.title || '';
                const img = document.createElement('img');
                img.src = im.src;
                img.alt = '';
                thumb.appendChild(img);
                if (im.title) {
                    const cap = document.createElement('div');
                    cap.className = 'thumb-caption';
                    cap.textContent = im.title;
                    thumb.appendChild(cap);
                }
                thumb.addEventListener('click', () => this.openLightbox(poiId, i));
                playerGallery.appendChild(thumb);
            });
            const add = document.createElement('button');
            add.className = 'poi-thumb-add';
            add.textContent = '+';
            add.title = 'Resim yükle';
            add.addEventListener('click', () => document.getElementById('galleryInput').click());
            playerGallery.appendChild(add);
        }

        /* DM görselleri için sade görüntüleyici: sadece resim, yazı alanı yok */
        openSimpleLightbox(srcList, index) {
            if (!srcList.length) return;
            let idx = Math.max(0, Math.min(index, srcList.length - 1));

            const lb = document.createElement('div');
            lb.className = 'lightbox';
            lb.innerHTML = `
                <div class="lb-stage">
                    <div class="lb-imgwrap"><img alt=""></div>
                </div>
                <button class="lb-btn lb-close" title="Kapat (Esc)">✕</button>
                <button class="lb-btn lb-prev" title="Önceki">‹</button>
                <button class="lb-btn lb-next" title="Sonraki">›</button>
                <div class="lb-count"></div>`;
            document.body.appendChild(lb);

            const img = lb.querySelector('img');
            const count = lb.querySelector('.lb-count');
            const render = () => {
                img.src = srcList[idx];
                count.textContent = (idx + 1) + ' / ' + srcList.length;
                const multi = srcList.length > 1;
                lb.querySelector('.lb-prev').style.display = multi ? '' : 'none';
                lb.querySelector('.lb-next').style.display = multi ? '' : 'none';
                count.style.display = multi ? '' : 'none';
            };
            const close = () => {
                document.removeEventListener('keydown', onKey);
                lb.remove();
            };
            const onKey = (e) => {
                if (e.key === 'Escape') close();
                else if (e.key === 'ArrowLeft') { idx = (idx - 1 + srcList.length) % srcList.length; render(); }
                else if (e.key === 'ArrowRight') { idx = (idx + 1) % srcList.length; render(); }
            };
            lb.querySelector('.lb-close').addEventListener('click', close);
            lb.querySelector('.lb-prev').addEventListener('click', () => { idx = (idx - 1 + srcList.length) % srcList.length; render(); });
            lb.querySelector('.lb-next').addEventListener('click', () => { idx = (idx + 1) % srcList.length; render(); });
            lb.addEventListener('click', (e) => { if (e.target === lb) close(); });
            document.addEventListener('keydown', onKey);
            render();
        }

        onGalleryFilesPicked(e) {
            const files = Array.from(e.target.files || []);
            e.target.value = '';
            if (!files.length || !this.selectedPoiId) return;
            const poiId = this.selectedPoiId;
            const data = this.getPoiData(poiId);
            let pending = files.length;
            files.forEach(file => {
                this.readImageScaled(file, 1280, 0.82).then(url => {
                    data.images.push({ src: url, title: '', desc: '' });
                    if (!this.trySaveProfile()) {
                        data.images.pop();
                        this.showToast('Depolama sınırı aşıldı — resim eklenemedi', true);
                    }
                }).catch(() => {
                    this.showToast('Resim okunamadı', true);
                }).finally(() => {
                    if (--pending === 0 && this.selectedPoiId === poiId) this.renderGallery(poiId);
                });
            });
        }

    /* ── Lightbox: resim + isim/not düzenleme ── */

        openLightbox(poiId, index) {
            const data = this.getPoiData(poiId);
            if (!data.images.length) return;
            let idx = Math.max(0, Math.min(index, data.images.length - 1));

            const lb = document.createElement('div');
            lb.className = 'lightbox';
            lb.innerHTML = `
                <div class="lb-stage">
                    <div class="lb-imgwrap"><img alt=""></div>
                    <div class="lb-meta">
                        <div class="lb-meta-eyebrow">Arşiv Kaydı</div>
                        <input class="lb-title-input" id="lbTitle" type="text" maxlength="60"
                            placeholder="İsim / mahlas ver...">
                        <div class="lb-ornament">
                            <span class="orn-line rev"></span>
                            <span class="orn-diamond"></span>
                            <span class="orn-line"></span>
                        </div>
                        <span class="lb-meta-label">Notlar</span>
                        <textarea class="text-input" id="lbDesc"
                            placeholder="Bu resim hakkında bildiklerin... (kim, ne, neden önemli)"></textarea>
                        <button class="btn btn-danger" id="lbDelete">Resmi Sil</button>
                    </div>
                </div>
                <button class="lb-btn lb-close" title="Kapat (Esc)">✕</button>
                <button class="lb-btn lb-prev" title="Önceki">‹</button>
                <button class="lb-btn lb-next" title="Sonraki">›</button>
                <div class="lb-count"></div>`;
            document.body.appendChild(lb);

            const img = lb.querySelector('img');
            const count = lb.querySelector('.lb-count');
            const titleIn = lb.querySelector('#lbTitle');
            const descIn = lb.querySelector('#lbDesc');

            const render = () => {
                const im = data.images[idx];
                img.src = im.src;
                titleIn.value = im.title || '';
                descIn.value = im.desc || '';
                count.textContent = (idx + 1) + ' / ' + data.images.length;
                const multi = data.images.length > 1;
                lb.querySelector('.lb-prev').style.display = multi ? '' : 'none';
                lb.querySelector('.lb-next').style.display = multi ? '' : 'none';
            };
            const close = () => {
                document.removeEventListener('keydown', onKey);
                lb.remove();
                this.renderGallery(poiId); // başlıklar/kapak güncellensin
            };
            const onKey = (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
                    if (e.key === 'Escape') { e.target.blur(); }
                    return;
                }
                if (e.key === 'Escape') close();
                else if (e.key === 'ArrowLeft') { idx = (idx - 1 + data.images.length) % data.images.length; render(); }
                else if (e.key === 'ArrowRight') { idx = (idx + 1) % data.images.length; render(); }
            };

            titleIn.addEventListener('input', () => {
                data.images[idx].title = titleIn.value;
                this.debouncedProfileSave();
            });
            descIn.addEventListener('input', () => {
                data.images[idx].desc = descIn.value;
                this.debouncedProfileSave();
            });
            lb.querySelector('#lbDelete').addEventListener('click', () => {
                this.showConfirm('Bu resim ve notları silinecek. Emin misin?', () => {
                    data.images.splice(idx, 1);
                    this.saveProfile();
                    if (data.images.length === 0) { close(); return; }
                    idx = Math.min(idx, data.images.length - 1);
                    render();
                });
            });
            lb.querySelector('.lb-close').addEventListener('click', close);
            lb.querySelector('.lb-prev').addEventListener('click', () => { idx = (idx - 1 + data.images.length) % data.images.length; render(); });
            lb.querySelector('.lb-next').addEventListener('click', () => { idx = (idx + 1) % data.images.length; render(); });
            lb.addEventListener('click', (e) => { if (e.target === lb) close(); });
            document.addEventListener('keydown', onKey);
            render();
        }

        /* ═══════════ PROFİL ═══════════ */

        defaultProfile() {
            return {
                name: 'Oyuncu', avatar: null, routes: [], pois: {}, customPois: [],
                calendar: { ...CAL_DEFAULT }
            };
        }

        loadProfile() {
            try {
                const raw = localStorage.getItem(this.profileKey);
                if (!raw) return this.defaultProfile();
                const p = this.normalizeProfile(JSON.parse(raw));
                // Migrasyon: eski 'okunta' id'si 'okukita' olarak yeniden adlandırıldı
                if (p.pois['okunta'] && !p.pois['okukita']) {
                    p.pois['okukita'] = p.pois['okunta'];
                    delete p.pois['okunta'];
                }
                return p;
            } catch (e) {
                return this.defaultProfile();
            }
        }

        normalizeProfile(p) {
            const d = this.defaultProfile();
            if (!p || typeof p !== 'object') return d;
            const pois = {};
            if (p.pois && typeof p.pois === 'object') {
                Object.keys(p.pois).forEach(id => {
                    const src = p.pois[id] || {};
                    pois[id] = {
                        info: typeof src.info === 'string' ? src.info : '',
                        notes: typeof src.notes === 'string' ? src.notes : '',
                        images: Array.isArray(src.images) ? src.images.map(im =>
                            typeof im === 'string'
                                ? { src: im, title: '', desc: '' }
                                : { src: String(im && im.src || ''),
                                    title: String(im && im.title || '').slice(0, 60),
                                    desc: String(im && im.desc || '') }
                        ).filter(im => im.src) : []
                    };
                });
            }
            let cal = { ...CAL_DEFAULT };
            if (p.calendar && typeof p.calendar === 'object') {
                const y = parseInt(p.calendar.year), m = parseInt(p.calendar.month), dy = parseInt(p.calendar.day);
                if (!isNaN(y) && m >= 0 && m < 10 && dy >= 1 && dy <= CAL_MONTHS[m][2]) {
                    cal = { year: y, month: m, day: dy };
                }
            }
            return {
                name: typeof p.name === 'string' && p.name.trim() ? p.name.trim().slice(0, 40) : d.name,
                avatar: typeof p.avatar === 'string' ? p.avatar : null,
                routes: Array.isArray(p.routes) ? p.routes.filter(r =>
                    r && typeof r === 'object' && Array.isArray(r.waypoints)) : [],
                pois,
                customPois: Array.isArray(p.customPois) ? p.customPois.filter(c =>
                    c && typeof c.id === 'string' && typeof c.x === 'number' && typeof c.y === 'number')
                    .map(c => ({ id: c.id, name: String(c.name || 'İsimsiz').slice(0, 50), type: 'ozel', x: c.x, y: c.y })) : [],
                calendar: cal
            };
        }

        trySaveProfile() {
            try {
                localStorage.setItem(this.profileKey, JSON.stringify(this.profile));
                return true;
            } catch (e) {
                return false;
            }
        }

        saveProfile() {
            if (!this.trySaveProfile()) {
                this.showToast('Depolama sınırı aşıldı — kaydedilemedi', true);
            }
        }

        debouncedProfileSave() {
            clearTimeout(this._saveTimer);
            this._saveTimer = setTimeout(() => this.saveProfile(), 500);
        }

        renderProfile() {
            const avatar = document.getElementById('profileAvatar');
            if (this.profile.avatar) {
                avatar.style.backgroundImage = `url("${this.profile.avatar}")`;
                avatar.textContent = '';
            } else {
                avatar.style.backgroundImage = '';
                avatar.textContent = (this.profile.name || 'O').trim().charAt(0).toLocaleUpperCase('tr');
            }
            const nameEl = document.getElementById('profileName');
            nameEl.innerHTML = '';
            nameEl.appendChild(document.createTextNode(this.profile.name));
            const ic = document.createElement('span');
            ic.className = 'edit-ic';
            ic.textContent = '✎';
            nameEl.appendChild(ic);

            const nRoutes = this.profile.routes.length;
            const nPois = this.profile.customPois.length;
            const nNotes = Object.values(this.profile.pois)
                .filter(dd => dd && ((dd.notes && dd.notes.trim()) || (dd.info && dd.info.trim()) || (dd.images && dd.images.length))).length;
            document.getElementById('profileSub').textContent =
                `${nRoutes} rota · ${nPois} özel POI · ${nNotes} kayıtlı yer`;
        }

        editProfileName() {
            const nameEl = document.getElementById('profileName');
            const input = document.createElement('input');
            input.className = 'text-input';
            input.type = 'text';
            input.maxLength = 40;
            input.value = this.profile.name;
            input.style.width = '100%';
            nameEl.replaceWith(input);
            input.focus();
            input.select();
            const commit = () => {
                this.profile.name = input.value.trim() || 'Oyuncu';
                this.saveProfile();
                const span = document.createElement('span');
                span.className = 'profile-name';
                span.id = 'profileName';
                span.title = 'İsmi değiştir';
                input.replaceWith(span);
                span.addEventListener('click', () => this.editProfileName());
                this.renderProfile();
            };
            input.addEventListener('blur', commit);
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') input.blur();
                if (e.key === 'Escape') { input.value = this.profile.name; input.blur(); }
            });
        }

        onAvatarPicked(e) {
            const file = e.target.files && e.target.files[0];
            e.target.value = '';
            if (!file) return;
            this.readImageScaled(file, 220, 0.85).then(url => {
                const prev = this.profile.avatar;
                this.profile.avatar = url;
                if (!this.trySaveProfile()) {
                    this.profile.avatar = prev;
                    this.showToast('Depolama sınırı aşıldı', true);
                    return;
                }
                this.renderProfile();
                this.showToast('Profil resmi güncellendi');
            }).catch(() => this.showToast('Resim okunamadı', true));
        }

        slugify(s) {
            return (s || '').toLocaleLowerCase('tr')
                .replace(/[çÇ]/g, 'c').replace(/[ğĞ]/g, 'g').replace(/[ıİi]/g, 'i')
                .replace(/[öÖ]/g, 'o').replace(/[şŞ]/g, 's').replace(/[üÜ]/g, 'u')
                .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
        }

        exportProfile() {
            const out = {
                type: 'aiwelen-profile',
                version: 1,
                exportedAt: new Date().toISOString(),
                profile: this.profile
            };
            this.downloadJson(out, `aiwelen-profil-${this.slugify(this.profile.name) || 'oyuncu'}.json`);
            this.showToast('Profil dışa aktarıldı');
        }

        onProfileFilePicked(e) {
            const file = e.target.files && e.target.files[0];
            e.target.value = '';
            if (!file) return;
            this.readJsonFile(file).then(obj => {
                if (!obj || obj.type !== 'aiwelen-profile' || !obj.profile) {
                    this.showToast('Geçersiz profil dosyası', true);
                    return;
                }
                this.showConfirm(
                    'İçe aktarılan profil mevcut profilin (rotalar, notlar, resimler) yerine geçecek. Devam edilsin mi?',
                    () => {
                        this.profile = this.normalizeProfile(obj.profile);
                        if (!this.trySaveProfile()) this.showToast('Profil çok büyük — kaydedilemedi', true);
                        this.afterProfileChange();
                        this.showToast('Profil içe aktarıldı');
                    });
            }).catch(() => this.showToast('Dosya okunamadı', true));
        }

        afterProfileChange() {
            this.closePoiPanel();
            this.renderPoiMarkers();
            this.renderLocationsList();
            this.renderProfile();
            this.renderPresets();
            this.renderCalendar();
            this.updateDetails();
        }

        /* ═══════════ ROTA PRESETLERİ ═══════════ */

        saveCurrentAsPreset() {
            if (this.waypoints.length < 2) {
                this.showToast('Kaydetmek için en az 2 noktalı bir rota çiz', true);
                return;
            }
            const input = document.getElementById('presetNameInput');
            const name = input.value.trim() || ('Rota ' + (this.profile.routes.length + 1));
            this.profile.routes.push({
                id: 'r' + Date.now(),
                name,
                createdAt: new Date().toISOString(),
                waypoints: this.waypoints.map(w => ({ x: w.mapX, y: w.mapY })),
                legs: this.legs.map(l => ({ ...l }))
            });
            this.saveProfile();
            input.value = '';
            this.renderPresets();
            this.renderProfile();
            this.showToast('Rota kaydedildi: ' + name);
        }

        renderPresets() {
            const list = document.getElementById('presetList');
            if (this.profile.routes.length === 0) {
                list.innerHTML = `<div class="loc-empty">Henüz kayıtlı rota yok. Rota çiz, isim ver, kaydet.</div>`;
                return;
            }
            list.innerHTML = '';
            this.profile.routes.forEach(route => {
                const totalMiles = this.routeMiles(route);
                const row = document.createElement('div');
                row.className = 'preset-row';

                const info = document.createElement('div');
                info.className = 'preset-info';
                info.title = 'Rotayı yükle';
                const nm = document.createElement('div');
                nm.className = 'preset-name';
                nm.textContent = route.name;
                const meta = document.createElement('div');
                meta.className = 'preset-meta';
                meta.textContent = `${route.waypoints.length} nokta · ${this.fmt(totalMiles)} mil`;
                info.appendChild(nm);
                info.appendChild(meta);
                info.addEventListener('click', () => this.loadPreset(route.id));

                const lnk = document.createElement('button');
                lnk.className = 'preset-btn';
                lnk.textContent = '∞';
                lnk.title = 'Rota linkini kopyala';
                lnk.addEventListener('click', () => this.copyRouteLink(route.name, route.waypoints, route.legs));

                const exp = document.createElement('button');
                exp.className = 'preset-btn';
                exp.textContent = '⤓';
                exp.title = 'Rotayı dosya olarak dışa aktar';
                exp.addEventListener('click', () => this.exportRoute(route));

                const del = document.createElement('button');
                del.className = 'preset-btn del';
                del.textContent = '✕';
                del.title = 'Rotayı sil';
                del.addEventListener('click', () => {
                    this.showConfirm(`"${route.name}" rotası silinecek. Emin misin?`, () => {
                        this.profile.routes = this.profile.routes.filter(r => r.id !== route.id);
                        this.saveProfile();
                        this.renderPresets();
                        this.renderProfile();
                        this.showToast('Rota silindi');
                    });
                });

                row.appendChild(info);
                row.appendChild(lnk);
                row.appendChild(exp);
                row.appendChild(del);
                list.appendChild(row);
            });
        }

        routeMiles(route) {
            let total = 0;
            for (let i = 0; i < route.waypoints.length - 1; i++) {
                const a = route.waypoints[i], b = route.waypoints[i + 1];
                total += Math.hypot(b.x - a.x, b.y - a.y) * this.milesPerPixel;
            }
            return total;
        }

        loadPreset(id) {
            const route = this.profile.routes.find(r => r.id === id);
            if (!route) return;
            const apply = () => {
                this.loadRouteData(route.waypoints, route.legs);
                this.showToast('Rota yüklendi: ' + route.name);
            };
            if (this.waypoints.length > 0) {
                this.showConfirm('Mevcut rota, "' + route.name + '" ile değiştirilecek. Devam edilsin mi?', apply);
            } else {
                apply();
            }
        }

        exportRoute(route) {
            const out = {
                type: 'aiwelen-route',
                version: 1,
                name: route.name,
                waypoints: route.waypoints,
                legs: route.legs
            };
            this.downloadJson(out, `aiwelen-rota-${this.slugify(route.name) || 'rota'}.json`);
            this.showToast('Rota dışa aktarıldı');
        }

        onRouteFilePicked(e) {
            const file = e.target.files && e.target.files[0];
            e.target.value = '';
            if (!file) return;
            this.readJsonFile(file).then(obj => {
                if (!obj || obj.type !== 'aiwelen-route' || !Array.isArray(obj.waypoints)) {
                    this.showToast('Geçersiz rota dosyası', true);
                    return;
                }
                this.profile.routes.push({
                    id: 'r' + Date.now(),
                    name: String(obj.name || 'İçe aktarılan rota').slice(0, 40),
                    createdAt: new Date().toISOString(),
                    waypoints: obj.waypoints
                        .filter(p => p && typeof p.x === 'number' && typeof p.y === 'number')
                        .map(p => ({ x: p.x, y: p.y })),
                    legs: Array.isArray(obj.legs) ? obj.legs : []
                });
                this.saveProfile();
                this.renderPresets();
                this.renderProfile();
                this.showToast('Rota içe aktarıldı — listeden yükleyebilirsin');
            }).catch(() => this.showToast('Dosya okunamadı', true));
        }

    /* ═══════════ TAKVİM ═══════════ */

        renderCalendar() {
            const body = document.getElementById('calendarBody');
            if (!this.calView) {
                this.calView = { year: this.profile.calendar.year, month: this.profile.calendar.month };
            }
            const v = this.calView;
            const [mName, mEpithet, mDays] = CAL_MONTHS[v.month];
            const cur = this.profile.calendar;

            let html = `
                <div class="cal-nav">
                    <button class="cal-nav-btn" data-cal="py" title="Önceki yıl">«</button>
                    <button class="cal-nav-btn" data-cal="pm" title="Önceki ay">‹</button>
                    <div class="cal-month-label" lang="en">${mName} · Z.G.S. ${v.year}
                        <span class="cal-epithet">"${mEpithet}" — ${mDays} gün</span>
                    </div>
                    <button class="cal-nav-btn" data-cal="nm" title="Sonraki ay">›</button>
                    <button class="cal-nav-btn" data-cal="ny" title="Sonraki yıl">»</button>
                </div>
                <div class="cal-grid">`;
            for (let day = 1; day <= mDays; day++) {
                const isToday = cur.year === v.year && cur.month === v.month && cur.day === day;
                html += `<div class="cal-day${isToday ? ' today' : ''}" data-day="${day}"
                    title="${day} ${mName} Z.G.S. ${v.year}">${day}</div>`;
            }
            html += `</div>
                <div class="cal-footer">
                    <div class="cal-current">${calFormatTr(cur)}</div>
                    <div class="cal-current-en" lang="en">${calFormatEn(cur)}</div>
                    <div class="cal-hint">Bir güne tıklayarak kampanya tarihini ayarla</div>
                </div>`;
            body.innerHTML = html;

            body.querySelector('[data-cal="pm"]').addEventListener('click', () => {
                v.month--; if (v.month < 0) { v.month = 9; v.year--; }
                this.renderCalendar();
            });
            body.querySelector('[data-cal="nm"]').addEventListener('click', () => {
                v.month++; if (v.month > 9) { v.month = 0; v.year++; }
                this.renderCalendar();
            });
            body.querySelector('[data-cal="py"]').addEventListener('click', () => { v.year--; this.renderCalendar(); });
            body.querySelector('[data-cal="ny"]').addEventListener('click', () => { v.year++; this.renderCalendar(); });
            body.querySelectorAll('.cal-day').forEach(cell => {
                cell.addEventListener('click', () => {
                    this.profile.calendar = { year: v.year, month: v.month, day: parseInt(cell.dataset.day) };
                    this.saveProfile();
                    this.renderCalendar();
                    this.updateDetails(); // varış tarihi güncellensin
                    this.showToast('Tarih ayarlandı: ' + calFormatTr(this.profile.calendar));
                });
            });
        }

        /* ═══════════ URL PAYLAŞIMI ═══════════
           Rota ve profil linkleri birbirinden tamamen bağımsızdır:
           #r= yalnızca rotayı, #p= yalnızca profili (resimler/avatar hariç) taşır. */

        shareRouteLink() {
            if (this.waypoints.length < 2) {
                this.showToast('Paylaşmak için en az 2 noktalı bir rota çiz', true);
                return;
            }
            this.copyRouteLink('',
                this.waypoints.map(w => ({ x: w.mapX, y: w.mapY })), this.legs);
        }

        copyRouteLink(name, wps, legs) {
            const code = encodeRouteCode(name, wps, legs);
            const url = shareBase() + '#r=' + code;
            this.copyToClipboard(url, 'Rota linki kopyalandı');
        }

        async shareProfileLink() {
            // Resimler ve avatar linke sığmaz — bilinçli olarak hariç tutulur
            const slim = {
                name: this.profile.name,
                routes: this.profile.routes,
                customPois: this.profile.customPois,
                calendar: this.profile.calendar,
                pois: {}
            };
            Object.keys(this.profile.pois).forEach(id => {
                const d = this.profile.pois[id];
                if ((d.info && d.info.trim()) || (d.notes && d.notes.trim())) {
                    slim.pois[id] = { info: d.info, notes: d.notes, images: [] };
                }
            });
            try {
                const { c, data } = await deflateText(JSON.stringify(slim));
                const code = (c ? 'z' : 'j') + bytesToB64url(data);
                const url = shareBase() + '#p=' + code;
                if (url.length > 2500) {
                    this.showToast('Profil link için çok büyük — dosya olarak dışa aktar', true);
                    return;
                }
                this.copyToClipboard(url, 'Profil linki kopyalandı (resimler hariç)');
            } catch (e) {
                this.showToast('Link oluşturulamadı', true);
            }
        }

        async handleShareHash() {
            const hash = location.hash || '';
            const clear = () => history.replaceState(null, '', location.pathname + location.search);

            if (hash.startsWith('#r=')) {
                const route = decodeRouteCode(hash.slice(3));
                clear();
                if (!route) { this.showToast('Geçersiz rota linki', true); return; }
                const label = route.name ? `"${route.name}" rotası` : 'Paylaşılan rota';
                this.showConfirm(label + ' bu bağlantıyla geldi. Haritaya yüklensin mi? (Mevcut rotanın yerine geçer)', () => {
                    this.loadRouteData(route.waypoints, route.legs);
                    this.showToast('Rota linkten yüklendi');
                });
            } else if (hash.startsWith('#p=')) {
                const code = hash.slice(3);
                clear();
                try {
                    const compressed = code[0] === 'z';
                    const text = await inflateToText(b64urlToBytes(code.slice(1)), compressed);
                    const incoming = this.normalizeProfile(JSON.parse(text));
                    this.showConfirm(
                        `"${incoming.name}" profili bu bağlantıyla geldi. İçe aktarılsın mı? ` +
                        'Rotalar, notlar ve özel POI\'ler değişir; cihazındaki resimler korunur.',
                        () => {
                            // Yereldeki resimleri ve avatarı koru
                            Object.keys(this.profile.pois).forEach(id => {
                                const localImgs = this.profile.pois[id].images;
                                if (localImgs && localImgs.length) {
                                    if (!incoming.pois[id]) incoming.pois[id] = { info: '', notes: '', images: [] };
                                    incoming.pois[id].images = localImgs;
                                }
                            });
                            incoming.avatar = this.profile.avatar;
                            this.profile = incoming;
                            if (!this.trySaveProfile()) this.showToast('Profil kaydedilemedi', true);
                            this.afterProfileChange();
                            this.showToast('Profil linkten içe aktarıldı');
                        });
                } catch (e) {
                    this.showToast('Geçersiz profil linki', true);
                }
            }
        }

        copyToClipboard(text, successMsg) {
            const fallback = () => this.showLinkModal(text);
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text)
                    .then(() => this.showToast(successMsg))
                    .catch(fallback);
            } else {
                fallback();
            }
        }

        showLinkModal(url) {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal-box">
                    <div class="modal-msg">Link hazır — kopyala:</div>
                    <input class="text-input" type="text" readonly>
                    <div class="btn-row">
                        <button class="btn" data-copy>Kopyala</button>
                        <button class="btn btn-danger" data-no>Kapat</button>
                    </div>
                </div>`;
            const input = overlay.querySelector('input');
            input.value = url;
            const close = () => overlay.remove();
            overlay.querySelector('[data-copy]').addEventListener('click', () => {
                input.select();
                try { document.execCommand('copy'); this.showToast('Kopyalandı'); } catch (e) {}
                close();
            });
            overlay.querySelector('[data-no]').addEventListener('click', close);
            overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
            document.body.appendChild(overlay);
            input.select();
        }

        /* ═══════════ YARDIMCILAR ═══════════ */

        downloadJson(obj, filename) {
            const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 2000);
        }

        readJsonFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    try { resolve(JSON.parse(reader.result)); }
                    catch (e) { reject(e); }
                };
                reader.onerror = reject;
                reader.readAsText(file);
            });
        }

        /* Resmi küçültüp dataURL döndürür (localStorage boyutu için) */
        readImageScaled(file, maxDim, quality) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const img = new Image();
                    img.onload = () => {
                        let { width, height } = img;
                        if (width > maxDim || height > maxDim) {
                            const s = maxDim / Math.max(width, height);
                            width = Math.round(width * s);
                            height = Math.round(height * s);
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = reject;
                    img.src = reader.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        showToast(msg, isError) {
            document.querySelectorAll('.toast').forEach(t => t.remove());
            const t = document.createElement('div');
            t.className = 'toast' + (isError ? ' error' : '');
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2800);
        }

        showConfirm(message, onYes) {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal-box">
                    <div class="modal-msg"></div>
                    <div class="btn-row" style="margin-top:0;">
                        <button class="btn" data-yes>Evet</button>
                        <button class="btn btn-danger" data-no>Vazgeç</button>
                    </div>
                </div>`;
            overlay.querySelector('.modal-msg').textContent = message;
            const close = () => overlay.remove();
            overlay.querySelector('[data-yes]').addEventListener('click', () => { close(); onYes(); });
            overlay.querySelector('[data-no]').addEventListener('click', close);
            overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
            document.body.appendChild(overlay);
        }

        /* ═══════════ ROTA KAYDI (otomatik) ═══════════ */

        saveRoute() {
            try {
                localStorage.setItem(this.routeKey, JSON.stringify({
                    waypoints: this.waypoints.map(w => ({ x: w.mapX, y: w.mapY })),
                    legs: this.legs
                }));
            } catch (e) { /* localStorage kapalıysa sessizce geç */ }
        }

        loadRoute() {
            let data;
            try {
                data = JSON.parse(localStorage.getItem(this.routeKey));
            } catch (e) { return; }
            if (!data || !Array.isArray(data.waypoints) || data.waypoints.length === 0) return;

            data.waypoints.forEach(p => {
                const waypoint = {
                    id: ++this.waypointCounter,
                    mapX: p.x, mapY: p.y,
                    element: this.createWaypointElement()
                };
                this.bindWaypointEvents(waypoint);
                this.waypoints.push(waypoint);
            });
            const defaults = this.getDefaults();
            const savedLegs = Array.isArray(data.legs) ? data.legs : [];
            for (let i = 0; i < this.waypoints.length - 1; i++) {
                const l = savedLegs[i] || {};
                this.legs.push({
                    pace: [30, 24, 18].includes(l.pace) ? l.pace : defaults.pace,
                    terrain: [1, 2].includes(l.terrain) ? l.terrain : defaults.terrain,
                    dailyHours: [2, 4, 6, 8, 10, 12].includes(l.dailyHours) ? l.dailyHours : defaults.dailyHours
                });
            }
            this.refreshWaypointNumbers();
        }
    }

    const mapApp = new MapApp();
    </script>
