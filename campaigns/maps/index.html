<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aiwelen Haritası — Yolculuk Planlayıcı</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;700;900&family=Lora:ital,wght@0,400;0,600;1,400&display=swap');

        :root {
            --gold:        #c9a84c;
            --gold-bright: #f5d080;
            --gold-dim:    #6b5420;
            --gold-glow:   rgba(201,168,76,0.35);
            --parchment:   #f2e8d0;
            --dark:        #080604;
            --red-accent:  #7a1f1f;
            --panel-bg:    rgba(8,5,2,0.84);
            --panel-border: rgba(201,168,76,0.25);
        }

        *, *::before, *::after { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            font-family: 'Lora', Georgia, serif;
            background: var(--dark);
            color: var(--parchment);
            overflow: hidden;
            height: 100vh;
        }

        /* ── KEYFRAMES ── */
        @keyframes pageFadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes titleDrop {
            from { opacity: 0; transform: translateY(-18px); letter-spacing: 10px; }
            to   { opacity: 1; transform: translateY(0); letter-spacing: 4px; }
        }
        @keyframes subtitleFade {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes panelSlideRight {
            from { opacity: 0; transform: translateX(26px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes panelSlideLeft {
            from { opacity: 0; transform: translateX(-26px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes panelSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes wpPop {
            0%   { transform: translate(-50%, -50%) scale(0); }
            65%  { transform: translate(-50%, -50%) scale(1.25); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
        @keyframes routeDash { to { stroke-dashoffset: -34; } }
        @keyframes legRowIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes poiPulse {
            0%   { transform: translate(-50%, -50%) rotate(45deg) scale(0.7); opacity: 0.85; }
            100% { transform: translate(-50%, -50%) rotate(45deg) scale(2.6); opacity: 0; }
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translate(-50%, 14px); }
            to   { opacity: 1; transform: translate(-50%, 0); }
        }
        @keyframes lightboxIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes lightboxImgIn {
            from { opacity: 0; transform: scale(0.94); }
            to   { opacity: 1; transform: scale(1); }
        }

        /* ── AMBİYANS ARKAPLANI ──
           Harita dışında kalan alan simsiyah kalmasın: haritanın bulanık,
           karartılmış bir kopyası tüm ekranı doldurur. */
        .map-underlay {
            position: fixed;
            inset: -60px;
            z-index: 0;
            background: url('aiwelen-map.jpg') center/cover no-repeat;
            filter: blur(26px) brightness(0.68) saturate(1.1);
            pointer-events: none;
            animation: pageFadeIn 1.4s ease both;
        }
        .map-underlay::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 50% 30%, rgba(60,40,10,0.12) 0%, transparent 65%),
                linear-gradient(180deg, rgba(4,2,1,0.22), rgba(4,2,1,0.4));
        }

        /* ── HARİTA ── */
        .map-viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            cursor: grab;
            touch-action: none;
            animation: pageFadeIn 0.9s ease both;
        }
        .map-viewport.dragging { cursor: grabbing; }
        .map-viewport.placing { cursor: crosshair; }
        .map-viewport.measuring { cursor: crosshair; }

        .map-image {
            position: absolute;
            width: 1920px;
            height: 1080px;
            background: url('aiwelen-map.jpg') no-repeat center center;
            background-size: contain;
            transform-origin: 0 0;
            z-index: 1;
        }

        .vignette {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            background:
                radial-gradient(ellipse at 50% 50%, transparent 60%, rgba(4,2,1,0.28) 100%),
                linear-gradient(180deg, rgba(4,2,1,0.32) 0%, transparent 12%, transparent 90%, rgba(4,2,1,0.36) 100%);
        }

        /* ── ROTA (SVG) ── */
        .route-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            overflow: visible;
        }
        .route-glow {
            fill: none;
            stroke: rgba(201,168,76,0.22);
            stroke-width: 8;
            stroke-linecap: round;
        }
        .route-path {
            fill: none;
            stroke: var(--gold);
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-dasharray: 12 10;
            animation: routeDash 1.6s linear infinite;
        }
        .route-path.difficult { stroke: #c25b5b; }
        .route-glow.difficult { stroke: rgba(194,91,91,0.22); }
        .route-path.highlighted { stroke: var(--gold-bright); stroke-width: 4; }
        .route-glow.highlighted { stroke: rgba(245,208,128,0.35); stroke-width: 12; }
        .route-path.difficult.highlighted { stroke: #e07f7f; }

        .measure-line {
            fill: none;
            stroke: #9fd0e0;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-dasharray: 7 8;
        }
        .measure-glow {
            fill: none;
            stroke: rgba(159,208,224,0.28);
            stroke-width: 10;
            stroke-linecap: round;
        }
        .measure-cap { fill: #9fd0e0; }

        .leg-label {
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 6;
            pointer-events: none;
            font-family: 'Cinzel', serif;
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--gold-bright);
            background: rgba(8,5,2,0.85);
            border: 1px solid var(--panel-border);
            border-radius: 3px;
            padding: 2px 7px;
            white-space: nowrap;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }
        .leg-label.difficult { border-color: rgba(194,91,91,0.45); color: #e8a8a8; }
        .leg-label.measure {
            border-color: rgba(159,208,224,0.55);
            color: #d4eef8;
            font-size: 0.78rem;
            padding: 4px 11px;
            letter-spacing: 1.5px;
        }

        /* ── NOKTALAR (WAYPOINT) ── */
        .waypoint {
            position: absolute;
            width: 28px;
            height: 28px;
            background: radial-gradient(circle at 35% 30%, rgba(40,28,8,0.95), rgba(8,5,2,0.95));
            border: 2px solid var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 12px;
            color: var(--gold-bright);
            cursor: pointer;
            z-index: 8;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 12px var(--gold-glow), 0 2px 6px rgba(0,0,0,0.8);
            animation: wpPop 0.35s cubic-bezier(.34,1.56,.64,1) both;
            user-select: none;
            touch-action: none;
        }
        .waypoint:hover {
            border-color: var(--gold-bright);
            box-shadow: 0 0 20px rgba(245,208,128,0.5), 0 2px 8px rgba(0,0,0,0.8);
        }
        .waypoint.first { border-color: var(--gold-bright); }
        .waypoint.dragging-wp { cursor: grabbing; box-shadow: 0 0 26px rgba(245,208,128,0.6); }

        /* ── POI İŞARETÇİLERİ ── */
        .poi {
            position: absolute;
            width: 26px;
            height: 26px;
            transform: translate(-50%, -50%);
            z-index: 7;
            cursor: pointer;
            user-select: none;
            touch-action: none;
        }
        .poi-diamond {
            position: absolute;
            left: 50%; top: 50%;
            width: 12px;
            height: 12px;
            transform: translate(-50%, -50%) rotate(45deg);
            background: linear-gradient(135deg, var(--gold-bright), var(--gold) 60%, #8a6f2c);
            border: 1.5px solid rgba(8,5,2,0.9);
            box-shadow: 0 0 8px rgba(201,168,76,0.55), 0 1px 4px rgba(0,0,0,0.8);
            transition: transform 0.2s ease, box-shadow 0.2s;
        }
        .poi-diamond::after {
            content: "";
            position: absolute;
            inset: 3px;
            background: rgba(8,5,2,0.75);
        }
        .poi:hover .poi-diamond {
            transform: translate(-50%, -50%) rotate(45deg) scale(1.35);
            box-shadow: 0 0 16px rgba(245,208,128,0.7), 0 1px 5px rgba(0,0,0,0.8);
        }
        .poi.custom .poi-diamond {
            background: linear-gradient(135deg, #e8f0f5, #9fb8c8 60%, #5d7383);
            box-shadow: 0 0 8px rgba(159,184,200,0.55), 0 1px 4px rgba(0,0,0,0.8);
        }
        .poi.active .poi-diamond {
            transform: translate(-50%, -50%) rotate(45deg) scale(1.35);
            background: linear-gradient(135deg, #fff2cf, var(--gold-bright) 60%, var(--gold));
        }
        .poi.active::before {
            content: "";
            position: absolute;
            left: 50%; top: 50%;
            width: 14px; height: 14px;
            border: 1.5px solid var(--gold-bright);
            transform: translate(-50%, -50%) rotate(45deg);
            animation: poiPulse 1.8s ease-out infinite;
        }
        .poi-label {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-top: 1px;
            font-family: 'Cinzel', serif;
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--gold-bright);
            background: rgba(8,5,2,0.85);
            border: 1px solid var(--panel-border);
            border-radius: 3px;
            padding: 2px 7px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }
        .poi:hover .poi-label, .poi.active .poi-label { opacity: 1; }

        /* ── ÜST BAŞLIK ── */
        .title-block {
            position: fixed;
            top: 1.1rem;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            z-index: 100;
        }
        .page-eyebrow {
            font-family: 'Cinzel', serif;
            font-size: 0.6rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: var(--gold-dim);
            margin-bottom: 0.25rem;
            animation: subtitleFade 1s ease 0.5s both;
        }
        .map-title {
            font-family: 'Cinzel Decorative', serif;
            font-size: clamp(1.05rem, 2.4vw, 1.55rem);
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold-bright);
            margin: 0;
            text-shadow:
                0 0 30px rgba(201,168,76,0.55),
                0 0 60px rgba(201,168,76,0.2),
                2px 2px 8px rgba(0,0,0,0.95);
            animation: titleDrop 1.2s cubic-bezier(.22,1,.36,1) 0.15s both;
        }

        /* ── YAN SÜTUNLAR ── */
        .side-col {
            position: fixed;
            top: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 16px;
            z-index: 100;
            pointer-events: none;
        }
        .side-col > * { pointer-events: auto; flex-shrink: 0; }
        .side-col.left  { left: 0;  width: 306px; animation: panelSlideLeft 0.8s ease 0.35s both; }
        .side-col.right {
            right: 0; width: 336px;
            animation: panelSlideRight 0.8s ease 0.45s both;
            transition: transform 0.45s cubic-bezier(.22,1,.36,1), opacity 0.35s ease;
        }
        .side-col.right.slid-out {
            transform: translateX(110%);
            opacity: 0;
            pointer-events: none;
        }
        .side-col.right.slid-out > * { pointer-events: none; }

        .top-row { display: flex; gap: 8px; }

        .back-link, .cal-toggle {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--gold-dim);
            font-family: 'Cinzel', serif;
            font-size: 0.72rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            border: 1px solid rgba(201,168,76,0.2);
            padding: 0.55rem 1.1rem;
            border-radius: 3px;
            background: var(--panel-bg);
            backdrop-filter: blur(6px);
            cursor: pointer;
            transition: color 0.3s, border-color 0.3s, background 0.3s;
        }
        .back-link:hover, .cal-toggle:hover, .cal-toggle.open {
            color: var(--gold-bright);
            border-color: rgba(201,168,76,0.55);
            background: rgba(201,168,76,0.07);
        }

        /* ── PANELLER ── */
        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 5px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 24px rgba(0,0,0,0.55);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            padding: 0.7rem 0.95rem;
            cursor: pointer;
            user-select: none;
            border-bottom: 1px solid rgba(201,168,76,0.14);
            transition: background 0.25s;
            flex-shrink: 0;
        }
        .panel-header:hover { background: rgba(201,168,76,0.06); }
        .panel-title {
            font-family: 'Cinzel', serif;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--gold);
        }
        .panel-chevron {
            color: var(--gold-dim);
            font-size: 0.7rem;
            transition: transform 0.3s;
        }
        .panel.collapsed .panel-chevron { transform: rotate(-90deg); }
        .panel-body {
            padding: 0.85rem 0.95rem 0.95rem;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--gold-dim) transparent;
        }
        .panel.collapsed .panel-body { display: none; }
        .panel.collapsed .panel-header { border-bottom-color: transparent; }

        .locations-panel { flex: 0 1 auto; }
        .locations-panel .panel-body { max-height: 40vh; padding-top: 0.65rem; }
        .defaults-panel { margin-top: auto; }
        .details-panel .panel-body { max-height: 34vh; }
        .presets-panel .panel-body { max-height: 22vh; }
        .calendar-panel { display: none; animation: panelSlideUp 0.35s ease both; }
        .calendar-panel.open { display: flex; }

        /* ── FORM ELEMANLARI ── */
        .control-group { margin-bottom: 0.75rem; }
        .control-group:last-child { margin-bottom: 0; }
        .control-label {
            display: block;
            margin-bottom: 0.3rem;
            font-family: 'Cinzel', serif;
            font-size: 0.6rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(242,232,208,0.55);
        }
        select, .text-input {
            width: 100%;
            padding: 0.45rem 0.5rem;
            border: 1px solid rgba(201,168,76,0.3);
            border-radius: 3px;
            background: rgba(8,5,2,0.9);
            color: var(--parchment);
            font-family: 'Lora', serif;
            font-size: 0.78rem;
            transition: border-color 0.25s, box-shadow 0.25s;
        }
        select { cursor: pointer; }
        select:hover, select:focus, .text-input:focus {
            border-color: rgba(201,168,76,0.6);
            outline: none;
            box-shadow: 0 0 8px rgba(201,168,76,0.15);
        }
        select option { background: #14100a; color: var(--parchment); }
        .text-input::placeholder { color: rgba(242,232,208,0.3); font-style: italic; }

        /* Uzun metin alanları — okunurluk için daha sıcak zemin, geniş satır aralığı */
        textarea.text-input {
            resize: vertical;
            min-height: 84px;
            padding: 0.65rem 0.75rem;
            font-size: 0.84rem;
            line-height: 1.75;
            color: rgba(242,232,208,0.92);
            background: rgba(24,17,7,0.75);
            box-shadow: inset 0 1px 6px rgba(0,0,0,0.45);
            scrollbar-width: thin;
            scrollbar-color: var(--gold-dim) transparent;
        }
        textarea.text-input:focus { background: rgba(28,20,8,0.85); }
        textarea.text-input::placeholder { line-height: 1.65; }

        .btn {
            display: block;
            width: 100%;
            padding: 0.5rem 0.8rem;
            border: 1px solid rgba(201,168,76,0.3);
            border-radius: 3px;
            background: rgba(201,168,76,0.08);
            color: var(--gold);
            font-family: 'Cinzel', serif;
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.25s, border-color 0.25s, color 0.25s;
        }
        .btn:hover {
            background: rgba(201,168,76,0.18);
            border-color: rgba(201,168,76,0.6);
            color: var(--gold-bright);
        }
        .btn.btn-danger {
            border-color: rgba(122,31,31,0.6);
            background: rgba(122,31,31,0.14);
            color: #d98a8a;
        }
        .btn.btn-danger:hover {
            background: rgba(122,31,31,0.3);
            border-color: rgba(180,60,60,0.7);
            color: #f0b0b0;
        }
        .btn-row { display: flex; gap: 0.5rem; margin-top: 0.8rem; }
        .btn-row .btn { flex: 1; }

        /* ── LOKASYON LİSTESİ ── */
        .loc-toolbar { display: flex; gap: 0.45rem; margin-bottom: 0.6rem; }
        .loc-toolbar .text-input { flex: 1; }
        .loc-add-btn {
            flex-shrink: 0;
            width: 34px;
            border: 1px solid rgba(201,168,76,0.3);
            border-radius: 3px;
            background: rgba(201,168,76,0.08);
            color: var(--gold);
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.25s, color 0.25s, border-color 0.25s;
        }
        .loc-add-btn:hover, .loc-add-btn.armed {
            background: rgba(201,168,76,0.2);
            color: var(--gold-bright);
            border-color: rgba(201,168,76,0.6);
        }
        .loc-row {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.42rem 0.5rem;
            border-radius: 3px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .loc-row:hover { background: rgba(201,168,76,0.08); }
        .loc-row.active { background: rgba(201,168,76,0.13); }
        .loc-diamond {
            width: 7px; height: 7px;
            flex-shrink: 0;
            background: var(--gold);
            transform: rotate(45deg);
            box-shadow: 0 0 4px var(--gold-glow);
        }
        .loc-row.custom .loc-diamond { background: #9fb8c8; box-shadow: 0 0 4px rgba(159,184,200,0.4); }
        .loc-name {
            flex: 1;
            font-family: 'Cinzel', serif;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.8px;
            color: var(--parchment);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .loc-type {
            font-family: 'Lora', serif;
            font-style: italic;
            font-size: 0.62rem;
            color: rgba(201,168,76,0.55);
            flex-shrink: 0;
        }
        .loc-empty {
            font-style: italic;
            font-size: 0.72rem;
            color: rgba(242,232,208,0.4);
            padding: 0.4rem 0.2rem;
        }

        /* ── POI PANELİ (sağdan açılan büyük pencere) ── */
        .poi-panel {
            position: fixed;
            top: 0; right: 0; bottom: 0;
            width: min(440px, 94vw);
            z-index: 110;
            transform: translateX(105%);
            transition: transform 0.5s cubic-bezier(.22,1,.36,1);
        }
        .poi-panel.open { transform: translateX(0); }
        .poi-panel-inner {
            height: 100%;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--gold-dim) transparent;
            background:
                linear-gradient(180deg, rgba(26,18,6,0.55), rgba(8,5,2,0.4) 220px),
                rgba(10,7,3,0.94);
            border-left: 1px solid rgba(201,168,76,0.35);
            box-shadow: -12px 0 50px rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            padding: 2rem 1.7rem 2.2rem;
        }
        .poi-panel-inner::before {
            content: "";
            position: absolute;
            top: 0; left: 4px; bottom: 0;
            width: 1px;
            background: linear-gradient(180deg, transparent, rgba(201,168,76,0.4) 20%, rgba(201,168,76,0.4) 80%, transparent);
            pointer-events: none;
        }
        .poi-panel-close {
            position: absolute;
            left: -34px;
            top: 50%;
            transform: translateY(-50%);
            width: 34px;
            height: 74px;
            border: 1px solid rgba(201,168,76,0.4);
            border-right: none;
            border-radius: 6px 0 0 6px;
            background: rgba(10,7,3,0.92);
            color: var(--gold);
            font-size: 1.15rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.25s, background 0.25s;
            backdrop-filter: blur(8px);
        }
        .poi-panel-close:hover {
            color: var(--gold-bright);
            background: rgba(201,168,76,0.12);
        }
        .poi-fade { animation: subtitleFade 0.55s ease both; }

        .poi-eyebrow {
            font-family: 'Cinzel', serif;
            font-size: 0.62rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: rgba(201,168,76,0.65);
            margin-bottom: 0.45rem;
        }
        .poi-title {
            font-family: 'Cinzel Decorative', serif;
            font-size: 1.45rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--gold-bright);
            line-height: 1.2;
            margin: 0 0 0.9rem;
            text-shadow: 0 0 30px rgba(201,168,76,0.4), 2px 2px 8px rgba(0,0,0,0.9);
        }
        input.poi-title-input {
            font-family: 'Cinzel Decorative', serif;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--gold-bright);
            margin-bottom: 0.9rem;
            padding: 0.5rem 0.6rem;
        }
        .poi-ornament {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0 0 1.2rem;
        }
        .poi-ornament .orn-line {

            height: 1px;
            background: linear-gradient(90deg, rgba(201,168,76,0.6), transparent);
        }
        .poi-ornament .orn-line.rev {
            background: linear-gradient(90deg, transparent, rgba(201,168,76,0.6));
        }
        .poi-ornament .orn-diamond {

            transform: rotate(45deg);
            box-shadow: 0 0 8px var(--gold-glow);
        }

        .poi-hero {
            position: relative;
            border: 1px solid rgba(201,168,76,0.3);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 0.5rem;
            cursor: pointer;
            background: rgba(0,0,0,0.4);
            transition: border-color 0.25s;
        }
        .poi-hero:hover { border-color: rgba(201,168,76,0.65); }
        .poi-hero img {
            width: 100%;
            aspect-ratio: 16/10;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease, filter 0.3s;
        }
        .poi-hero:hover img { transform: scale(1.03); filter: brightness(1.08); }
        .poi-hero .hero-caption {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            padding: 1.8rem 0.9rem 0.65rem;
            background: linear-gradient(transparent, rgba(4,2,1,0.92) 65%);
            font-family: 'Cinzel', serif;
            font-size: 0.74rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--gold-bright);
            text-align: center;
            text-shadow: 0 0 20px rgba(201,168,76,0.35), 0 2px 6px rgba(0,0,0,0.95);
        }

        .poi-gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.4rem;
            margin-bottom: 0.4rem;
        }
        .poi-thumb {
            position: relative;
            aspect-ratio: 1;
            border: 1px solid rgba(201,168,76,0.25);
            border-radius: 3px;
            overflow: hidden;
            cursor: pointer;
            background: rgba(0,0,0,0.4);
            transition: border-color 0.25s, transform 0.2s;
        }
        .poi-thumb:hover { border-color: rgba(201,168,76,0.6); transform: scale(1.05); }
        .poi-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .poi-thumb .thumb-caption {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            padding: 0.8rem 0.2rem 0.2rem;
            background: linear-gradient(transparent, rgba(4,2,1,0.92));
            font-family: 'Cinzel', serif;
            font-size: 0.5rem;
            font-weight: 700;
            letter-spacing: 0.4px;
            color: var(--gold-bright);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        .poi-thumb:hover .thumb-caption { opacity: 1; }
        .poi-thumb-add {
            aspect-ratio: 1;
            border: 1px dashed rgba(201,168,76,0.4);
            border-radius: 3px;
            background: none;
            color: var(--gold-dim);
            font-size: 1.3rem;
            cursor: pointer;
            transition: color 0.25s, border-color 0.25s, background 0.25s;
        }
        .poi-thumb-add:hover {
            color: var(--gold-bright);
            border-color: rgba(201,168,76,0.7);
            background: rgba(201,168,76,0.06);
        }

        .poi-section-title {
            font-family: 'Cinzel', serif;
            font-size: 0.64rem;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: rgba(201,168,76,0.7);
            margin: 1.3rem 0 0.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .poi-section-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(201,168,76,0.3), transparent);
        }
        .poi-info-text {
            font-family: 'Lora', serif;
            font-size: 0.84rem;
            line-height: 1.7;
            color: rgba(242,232,208,0.85);
            white-space: pre-wrap;
        }
        .poi-info-text.empty {
            font-style: italic;
            color: rgba(242,232,208,0.4);
        }

        /* ── PROFİL ── */
        .profile-body { display: flex; align-items: center; gap: 0.75rem; }
        .profile-avatar {
            position: relative;
            width: 52px; height: 52px;
            flex-shrink: 0;
            border-radius: 50%;
            border: 2px solid rgba(201,168,76,0.45);
            background: rgba(201,168,76,0.08) center/cover no-repeat;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel Decorative', serif;
            font-size: 1.15rem;
            color: var(--gold);
            transition: border-color 0.25s, box-shadow 0.25s;
            overflow: hidden;
        }
        .profile-avatar:hover {
            border-color: var(--gold-bright);
            box-shadow: 0 0 14px rgba(201,168,76,0.35);
        }
        .profile-avatar::after {
            content: "✎";
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(8,5,2,0.55);
            color: var(--gold-bright);
            font-size: 0.85rem;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .profile-avatar:hover::after { opacity: 1; }
        .profile-info { flex: 1; min-width: 0; }
        .profile-name {
            font-family: 'Cinzel', serif;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--gold-bright);
            cursor: pointer;
            display: inline-flex;
            align-items: baseline;
            gap: 0.4rem;
            max-width: 100%;
        }
        .profile-name:hover { text-decoration: underline; text-decoration-color: rgba(201,168,76,0.5); }
        .profile-name .edit-ic { font-size: 0.65rem; color: var(--gold-dim); }
        .profile-sub {
            font-size: 0.66rem;
            font-style: italic;
            color: rgba(242,232,208,0.45);
            margin-top: 2px;
        }
        .profile-actions { display: flex; gap: 0.4rem; margin-top: 0.75rem; }
        .profile-actions .btn { flex: 1; padding: 0.42rem 0.3rem; font-size: 0.54rem; }

        /* ── ROTA ÖZETİ ── */
        .empty-state {
            font-style: italic;
            font-size: 0.8rem;
            color: rgba(242,232,208,0.5);
            line-height: 1.6;
        }
        .empty-state .hint {
            display: block;
            margin-top: 0.6rem;
            font-size: 0.7rem;
            color: rgba(201,168,76,0.45);
        }
        .summary-box {
            border: 1px solid rgba(201,168,76,0.22);
            border-left: 3px solid var(--gold);
            border-radius: 3px;
            background: rgba(201,168,76,0.06);
            padding: 0.7rem 0.8rem;
            margin-bottom: 0.9rem;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 0.8rem;
            padding: 0.18rem 0;
            font-size: 0.78rem;
        }
        .summary-row .s-label {
            font-family: 'Cinzel', serif;
            font-size: 0.58rem;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: rgba(242,232,208,0.5);
            white-space: nowrap;
        }
        .summary-row .s-value { color: var(--parchment); text-align: right; }
        .summary-row.main .s-value {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            color: var(--gold-bright);
            font-size: 0.85rem;
        }
        .summary-sep {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(201,168,76,0.3), transparent);
            margin: 0.4rem 0;
        }

        /* ── ETAP LİSTESİ ── */
        .legs-title {
            font-family: 'Cinzel', serif;
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(201,168,76,0.6);
            margin: 0 0 0.5rem;
        }
        .leg-row {
            border: 1px solid rgba(201,168,76,0.16);
            border-radius: 4px;
            background: rgba(255,255,255,0.02);
            padding: 0.55rem 0.65rem;
            margin-bottom: 0.55rem;
            transition: border-color 0.25s, background 0.25s;
            animation: legRowIn 0.35s ease both;
        }
        .leg-row:hover {
            border-color: rgba(201,168,76,0.45);
            background: rgba(201,168,76,0.05);
        }
        .leg-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 0.5rem;
            margin-bottom: 0.45rem;
        }
        .leg-name {
            font-family: 'Cinzel', serif;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--gold);
            white-space: nowrap;
        }
        .leg-stats {
            font-size: 0.68rem;
            color: rgba(242,232,208,0.65);
            text-align: right;
            line-height: 1.45;
        }
        .leg-stats b { color: var(--parchment); font-weight: 600; }
        .leg-controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.35rem;
        }
        .leg-controls select { padding: 0.3rem 0.25rem; font-size: 0.66rem; }
        .leg-controls .mini-label {
            font-family: 'Cinzel', serif;
            font-size: 0.5rem;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: rgba(242,232,208,0.4);
            margin-bottom: 0.15rem;
            display: block;
        }

        /* ── PRESET LİSTESİ ── */
        .preset-save-row { display: flex; gap: 0.45rem; margin-bottom: 0.65rem; }
        .preset-save-row .text-input { flex: 1; }
        .preset-save-row .btn { width: auto; flex-shrink: 0; padding: 0.45rem 0.7rem; }
        .preset-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0.5rem;
            border: 1px solid rgba(201,168,76,0.14);
            border-radius: 3px;
            margin-bottom: 0.4rem;
            background: rgba(255,255,255,0.02);
            transition: border-color 0.2s;
        }
        .preset-row:hover { border-color: rgba(201,168,76,0.4); }
        .preset-info { flex: 1; min-width: 0; cursor: pointer; }
        .preset-name {
            font-family: 'Cinzel', serif;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.8px;
            color: var(--parchment);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .preset-info:hover .preset-name { color: var(--gold-bright); }
        .preset-meta {
            font-size: 0.6rem;
            font-style: italic;
            color: rgba(242,232,208,0.4);
        }
        .preset-btn {
            flex-shrink: 0;
            width: 24px; height: 24px;
            border: 1px solid rgba(201,168,76,0.25);
            border-radius: 3px;
            background: none;
            color: var(--gold-dim);
            font-size: 0.68rem;
            line-height: 1;
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s;
        }
        .preset-btn:hover { color: var(--gold-bright); border-color: rgba(201,168,76,0.6); }
        .preset-btn.del:hover { color: #f0b0b0; border-color: rgba(180,60,60,0.7); }

        /* ── TAKVİM ── */
        .cal-nav {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            margin-bottom: 0.7rem;
        }
        .cal-nav-btn {
            width: 26px; height: 26px;
            border: 1px solid rgba(201,168,76,0.3);
            border-radius: 3px;
            background: rgba(201,168,76,0.06);
            color: var(--gold);
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s;
            flex-shrink: 0;
        }
        .cal-nav-btn:hover { background: rgba(201,168,76,0.16); color: var(--gold-bright); }
        .cal-month-label {
            flex: 1;
            text-align: center;
            font-family: 'Cinzel', serif;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--gold-bright);
            line-height: 1.3;
        }
        .cal-month-label .cal-epithet {
            display: block;
            font-family: 'Lora', serif;
            font-style: italic;
            font-size: 0.6rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            text-transform: none;
            color: rgba(242,232,208,0.5);
        }
        .cal-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 3px;
        }
        .cal-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            font-size: 0.56rem;
            font-weight: 700;
            color: rgba(242,232,208,0.7);
            border: 1px solid rgba(201,168,76,0.12);
            border-radius: 3px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
            user-select: none;
        }
        .cal-day:hover {
            background: rgba(201,168,76,0.14);
            color: var(--gold-bright);
            border-color: rgba(201,168,76,0.45);
        }
        .cal-day.today {
            background: linear-gradient(135deg, var(--gold-bright), var(--gold));
            color: #14100a;
            border-color: var(--gold-bright);
            box-shadow: 0 0 10px rgba(201,168,76,0.5);
        }
        .cal-footer {
            margin-top: 0.75rem;
            padding-top: 0.6rem;
            border-top: 1px solid rgba(201,168,76,0.15);
            text-align: center;
        }
        .cal-current {
            font-family: 'Cinzel', serif;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--gold-bright);
        }
        .cal-current-en {
            font-family: 'Lora', serif;
            font-style: italic;
            font-size: 0.62rem;
            color: rgba(242,232,208,0.45);
            margin-top: 3px;
        }
        .cal-hint {
            font-size: 0.58rem;
            font-style: italic;
            color: rgba(201,168,76,0.4);
            margin-top: 0.5rem;
        }

        /* ── ALT HUD ── */
        .map-hud {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 0.9rem;
            padding: 0.55rem 1rem;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 5px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 24px rgba(0,0,0,0.55);
            z-index: 100;
            animation: panelSlideUp 0.8s ease 0.6s both;
        }
        .hud-btn {
            width: 30px; height: 30px;
            border: 1px solid rgba(201,168,76,0.3);
            border-radius: 3px;
            background: rgba(201,168,76,0.06);
            color: var(--gold);
            font-family: 'Cinzel', serif;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.25s, color 0.25s, border-color 0.25s;
        }
        .hud-btn:hover {
            background: rgba(201,168,76,0.16);
            color: var(--gold-bright);
            border-color: rgba(201,168,76,0.6);
        }
        .hud-btn.armed {
            background: rgba(159,208,224,0.15);
            color: #c8e8f2;
            border-color: rgba(159,208,224,0.6);
        }
        .hud-zoom-wrap { position: relative; }
        .hud-zoom-pct {
            font-family: 'Cinzel', serif;
            font-size: 0.66rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--parchment);
            min-width: 48px;
            text-align: center;
            background: none;
            border: 1px solid transparent;
            border-radius: 3px;
            padding: 0.32rem 0.2rem;
            cursor: pointer;
            transition: color 0.25s, border-color 0.25s, background 0.25s;
        }
        .hud-zoom-pct:hover, .hud-zoom-pct.open {
            color: var(--gold-bright);
            border-color: rgba(201,168,76,0.4);
            background: rgba(201,168,76,0.08);
        }
        .zoom-menu {
            position: absolute;
            bottom: calc(100% + 12px);
            left: 50%;
            transform: translateX(-50%);
            display: none;
            flex-direction: column-reverse;
            gap: 2px;
            padding: 5px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            backdrop-filter: blur(8px);
            box-shadow: 0 6px 26px rgba(0,0,0,0.6);
            z-index: 130;
            animation: panelSlideUp 0.2s ease both;
        }
        .zoom-menu.open { display: flex; }
        .zoom-menu button {
            border: 1px solid transparent;
            border-radius: 3px;
            background: none;
            color: rgba(242,232,208,0.75);
            font-family: 'Cinzel', serif;
            font-size: 0.64rem;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 0.32rem 1rem;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s, color 0.15s;
        }
        .zoom-menu button:hover {
            background: rgba(201,168,76,0.14);
            color: var(--gold-bright);
        }
        .zoom-menu button.current {
            color: var(--gold-bright);
            border-color: rgba(201,168,76,0.4);
            background: rgba(201,168,76,0.08);
        }
        .hud-sep {
            width: 1px;
            height: 26px;
            background: linear-gradient(180deg, transparent, rgba(201,168,76,0.4), transparent);
        }
        .hud-scale { display: flex; align-items: center; gap: 0.6rem; }
        .scale-ruler { position: relative; height: 12px; transition: width 0.15s ease; }
        .scale-ruler::before {
            content: "";
            position: absolute;
            left: 0; right: 0; bottom: 0;
            height: 4px;
            border: 1.5px solid var(--gold);
            border-top: none;
            box-shadow: 0 1px 4px rgba(0,0,0,0.6);
        }
        .scale-ruler::after {
            content: "";
            position: absolute;
            left: 50%; bottom: 0;
            width: 1.5px; height: 7px;
            background: var(--gold);
        }
        .scale-value {
            font-family: 'Cinzel', serif;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--gold-bright);
            white-space: nowrap;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }

        /* ── TOAST ── */
        .toast {
            position: fixed;
            bottom: 76px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel-bg);
            border: 1px solid rgba(201,168,76,0.45);
            border-radius: 4px;
            padding: 0.55rem 1.1rem;
            font-family: 'Cinzel', serif;
            font-size: 0.66rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--gold-bright);
            z-index: 400;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            animation: toastIn 0.3s ease both;
            pointer-events: none;
            white-space: nowrap;
        }
        .toast.error { border-color: rgba(180,60,60,0.7); color: #f0b0b0; }

        /* ── LIGHTBOX ── */
        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 300;
            background: rgba(4,2,1,0.93);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: lightboxIn 0.25s ease both;
            padding: 60px 24px 50px;
        }
        .lb-stage {
            display: flex;
            gap: 1.2rem;
            align-items: stretch;
            max-width: min(94vw, 1400px);
            max-height: 84vh;
            animation: lightboxImgIn 0.3s cubic-bezier(.22,1,.36,1) both;
        }
        .lb-imgwrap {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }
        .lb-stage img {
            max-width: 100%;
            max-height: 84vh;
            object-fit: contain;
            border: 1px solid rgba(201,168,76,0.4);
            border-radius: 4px;
            box-shadow: 0 0 60px rgba(0,0,0,0.9), 0 0 30px rgba(201,168,76,0.12);
        }
        .lb-meta {
            width: 336px;
            flex-shrink: 0;
            background:
                linear-gradient(180deg, rgba(34,24,9,0.94) 0%, rgba(12,8,3,0.95) 190px),
                rgba(10,7,3,0.95);
            border: 1px solid rgba(201,168,76,0.38);
            border-radius: 5px;
            padding: 1.4rem 1.3rem 1.25rem;
            display: flex;
            flex-direction: column;

    <script>
    /* ═══════════ SABİT POI LİSTESİ ═══════════

        { id: 'yamai',             name: 'Yamai',                       type: 'sehir',          x: 616,   y: 792,   info: '' },
        { id: 'irongrove',         name: 'Irongrove',                   type: 'sehir',          x: 915,   y: 768,   info: '' },
        { id: 'white-citadel',     name: 'White Citadel',               type: 'baskent',        x: 1038,  y: 557,   info: '' },
        { id: 'moradin-pass',      name: 'Moradin Pass',                type: 'sinir',          x: 1408,  y: 558,   info: '' },
        { id: 'mountainside',      name: 'Mountainside',                type: 'sehir',          x: 1545,  y: 643,   info: '' },
        { id: 'white-linn',        name: 'White Linn',                  type: 'sehir',          x: 1292,  y: 761,   info: '' },
        { id: 'alve-dorei',        name: 'Alve Dorei',                  type: 'baskent',        x: 610,   y: 1004,  info: '' },
        { id: 'merdalon',          name: 'Merdalon',                    type: 'fener',          x: 935,   y: 930,   info: '' },
        { id: 'lierin',            name: 'Lierin',                      type: 'dogayerleske',   x: 1153,  y: 994,   info: '' },
        { id: 'order-ruins',       name: 'Fortress of the Order Ruins', type: 'harabe',         x: 1482,  y: 851,   info: '' }
    ];

    /* DM (site sahibi) görselleri — POI panelinin üst "Arşiv Görselleri" alanında
       gösterilir; ziyaretçiler ekleyemez/silemez. Dosyaları bu klasöre (veya bir alt
       klasöre) koyup yollarını buraya yaz. Örn:
       'white-citadel': ['img/white-citadel-1.jpg', 'img/white-citadel-2.jpg'] */
    const DM_IMAGES = {
    };

    /* ═══════════ AİWELEN TAKVİMİ ═══════════
       Yıl = 10 ay, toplam 304 gün. Z.G.S. = Zafer Gününden Sonra (A.V.D.) */
    const CAL_MONTHS = [
        ['MARTUS',    'Coldlight',    31],
        ['APRALAS',   'Breezen',      30],
        ['MAIUS',     'Mildlight',    31],
        ['ONIOS',     'Flower',       30],
        ['QUINTILES', 'Summerwake',   31],
        ['SECTILIS',  'Highsun Days', 30],
        ['SEPTER',    'Last Ember',   30],
        ['OCTER',     'Yellowleaf',   31],
        ['NOVA',      'Winterwake',   30],
        ['DECAN',     'Nightwold',    30]
    ];
    const CAL_YEAR_DAYS = 304;
    const CAL_DEFAULT = { year: 27, month: 2, day: 6 }; // 6 MAIUS Z.G.S. 27

    function calDayOfYear(d) {
        let n = d.day - 1;
        for (let i = 0; i < d.month; i++) n += CAL_MONTHS[i][2];
        return n;
    }
    function calFromTotal(total) {
        const year = Math.floor(total / CAL_YEAR_DAYS);
        let doy = total - year * CAL_YEAR_DAYS;
        let month = 0;
        while (doy >= CAL_MONTHS[month][2]) { doy -= CAL_MONTHS[month][2]; month++; }
        return { year, month, day: doy + 1 };
    }
    function calAddDays(d, n) {
        return calFromTotal(d.year * CAL_YEAR_DAYS + calDayOfYear(d) + n);
    }
    function calFormatTr(d) {
        return d.day + ' ' + CAL_MONTHS[d.month][0] + ' Z.G.S. ' + d.year;
    }
    function calFormatEn(d) {
        const day = d.day;
        const suf = (day % 10 === 1 && day !== 11) ? 'st'
                  : (day % 10 === 2 && day !== 12) ? 'nd'
                  : (day % 10 === 3 && day !== 13) ? 'rd' : 'th';
        return day + suf + ' day of ' + CAL_MONTHS[d.month][0] + ', "' + CAL_MONTHS[d.month][1] + '", Year ' + d.year + ' A.V.D.';
    }

    /* ═══════════ URL PAYLAŞIM YARDIMCILARI ═══════════
       Koordinatlar base62 ile 2 karaktere sığar (62² = 3844 > 1920). */
    const B62 = '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const toB62 = n => {
        n = Math.max(0, Math.min(3843, Math.round(n)));
        return B62[Math.floor(n / 62)] + B62[n % 62];
    };
    const fromB62 = s => {
        const a = B62.indexOf(s[0]), b = B62.indexOf(s[1]);
        return (a === -1 || b === -1) ? NaN : a * 62 + b;
    };
    const PACE_LIST = [30, 24, 18];
    const HOURS_LIST = [2, 4, 6, 8, 10, 12];

    function encodeRouteCode(name, wps, legs) {
        let s = 'B';
        s += wps.map(w => toB62(w.x) + toB62(w.y)).join('');
        s += '-' + legs.map(l => {
            const p = Math.max(0, PACE_LIST.indexOf(l.pace));
            const t = l.terrain === 2 ? 1 : 0;
            const h = Math.max(0, HOURS_LIST.indexOf(l.dailyHours));
            return B62[p * 12 + t * 6 + h];
        }).join('');
        if (name) s += '~' + encodeURIComponent(String(name).slice(0, 30).replace(/ /g, '_'));
        return s;
    }
    function decodeRouteCode(code) {
        try {
            if (!code || code[0] !== 'B') return null;
            let rest = code.slice(1);
            let name = '';
            const tilde = rest.indexOf('~');
            if (tilde !== -1) {
                name = decodeURIComponent(rest.slice(tilde + 1)).replace(/_/g, ' ').slice(0, 40);
                rest = rest.slice(0, tilde);
            }
            const dash = rest.indexOf('-');
            if (dash === -1) return null;
            const wpStr = rest.slice(0, dash);
            const legStr = rest.slice(dash + 1);
            if (wpStr.length % 4 !== 0) return null;
            const wps = [];
            for (let i = 0; i < wpStr.length; i += 4) {
                const x = fromB62(wpStr.slice(i, i + 2));
                const y = fromB62(wpStr.slice(i + 2, i + 4));
                if (isNaN(x) || isNaN(y) || x > 1920 || y > 1080) return null;
                wps.push({ x, y });
            }
            if (wps.length < 2) return null;
            const legs = [];
            for (let i = 0; i < wps.length - 1; i++) {
                const v = B62.indexOf(legStr[i] || '0');
                if (v === -1) return null;
                legs.push({
                    pace: PACE_LIST[Math.floor(v / 12) % 3] || 24,
                    terrain: Math.floor(v / 6) % 2 === 1 ? 2 : 1,
                    dailyHours: HOURS_LIST[v % 6] || 8
                });
            }
            return { name, waypoints: wps, legs };
        } catch (e) { return null; }
    }

    /* Paylaşım URL tabanı: sondaki index.html'i at — daha kısa ve temiz görünür */
    function shareBase() {
        return location.origin + location.pathname.replace(/index\.html$/, '');
    }

    function bytesToB64url(bytes) {
        let bin = '';
        for (let i = 0; i < bytes.length; i += 8192) {
            bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
        }
        return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    function b64urlToBytes(s) {
        s = s.replace(/-/g, '+').replace(/_/g, '/');
        while (s.length % 4) s += '=';
        const bin = atob(s);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
    }
    async function deflateText(text) {
        const input = new TextEncoder().encode(text);
        if (typeof CompressionStream === 'undefined') return { c: false, data: input };
        const stream = new Blob([input]).stream().pipeThrough(new CompressionStream('deflate-raw'));
        const buf = await new Response(stream).arrayBuffer();
        return { c: true, data: new Uint8Array(buf) };
    }
    async function inflateToText(bytes, compressed) {
        if (!compressed) return new TextDecoder().decode(bytes);
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
        const buf = await new Response(stream).arrayBuffer();
        return new TextDecoder().decode(buf);
    }

    class MapApp {
        constructor() {
            this.viewport = document.getElementById('mapViewport');
            this.mapImage = document.getElementById('mapImage');
            this.routeSvg = document.getElementById('routeSvg');
            this.detailsContent = document.getElementById('detailsContent');
            this.locationsBody = document.getElementById('locationsBody');

            this.defaultPaceSel = document.getElementById('defaultPace');
            this.defaultTerrainSel = document.getElementById('defaultTerrain');
            this.defaultHoursSel = document.getElementById('defaultHours');

            // ── HARİTA ÖLÇEĞİ ──
            // Tüm mesafe/süre hesapları bu tek katsayıdan türer; değiştirirsen
            // etaplar, cetvel, ölçek çubuğu ve varış tarihi birlikte ölçeklenir.
            this.mapWidth = 1920;
            this.mapHeight = 1080;
            this.milesPerPixel = 2.1;

            this.minZoom = 0.3;
            this.maxZoom = 3;
            this.zoom = 0.8;
            this.panX = 0;
            this.panY = 0;

            this.waypoints = [];
            this.legs = [];
            this.waypointCounter = 0;
            this.highlightedLeg = -1;

            this.isPanning = false;
            this.didPan = false;
            this.dragStartX = 0;
            this.dragStartY = 0;
            this.lastPanX = 0;
            this.lastPanY = 0;
            this.wpDrag = null;
            this.poiDrag = null;
            this.flyAnim = null;

            this.selectedPoiId = null;
            this.placingPoi = false;
            this.measuring = false;
            this.measureDrag = false;
            this.measure = null;
            this.locFilter = '';
            this.poiMarkers = new Map();
            this.calView = null;

            this.routeKey = 'aiwelen-map-route-v2';
            this.profileKey = 'aiwelen-map-profile-v1';
            this.profile = this.loadProfile();

            this.init();
        }

        init() {
            this.fitView();
            this.initEventListeners();
            this.loadRoute();
            this.renderPoiMarkers();
            this.renderLocationsList();
            this.renderProfile();
            this.renderPresets();
            this.renderCalendar();
            this.updateMapTransform();
            this.updateDetails();
            this.handleShareHash();
        }

        /* ═══════════ GÖRÜNÜM ═══════════ */

        fitView() {
            const cw = this.viewport.clientWidth;
            const ch = this.viewport.clientHeight;
            this.zoom = Math.max(this.minZoom,
                Math.min(this.maxZoom, Math.min(cw / this.mapWidth, ch / this.mapHeight)));
            this.panX = (cw - this.mapWidth * this.zoom) / 2;
            this.panY = (ch - this.mapHeight * this.zoom) / 2;
        }

        zoomAtCenter(delta) {
            this.zoomAtPoint(this.viewport.clientWidth / 2, this.viewport.clientHeight / 2, delta);
        }

        /* Ekran merkezini sabit tutarak mutlak zoom seviyesine geç */
        setZoomLevel(z) {
            const cx = this.viewport.clientWidth / 2;
            const cy = this.viewport.clientHeight / 2;
            const newZoom = Math.max(this.minZoom, Math.min(this.maxZoom, z));
            const mapX = (cx - this.panX) / this.zoom;
            const mapY = (cy - this.panY) / this.zoom;
            this.zoom = newZoom;
            this.panX = cx - mapX * this.zoom;
            this.panY = cy - mapY * this.zoom;
            this.constrainPan();
            this.updateMapTransform();
        }

        toggleZoomMenu(open) {
            const menu = document.getElementById('zoomMenu');
            const pct = document.getElementById('zoomPct');
            menu.classList.toggle('open', open);
            pct.classList.toggle('open', open);
            if (open) {
                const cur = Math.round(this.zoom * 100);
                menu.querySelectorAll('button').forEach(b => {
                    b.classList.toggle('current', parseInt(b.dataset.zoom) === cur);
                });
            }
        }

        zoomAtPoint(screenX, screenY, delta) {
            const oldZoom = this.zoom;
            const newZoom = Math.max(this.minZoom, Math.min(this.maxZoom, this.zoom + delta));
            if (newZoom === oldZoom) return;
            const mapX = (screenX - this.panX) / oldZoom;
            const mapY = (screenY - this.panY) / oldZoom;
            this.zoom = newZoom;
            this.panX = screenX - mapX * this.zoom;
            this.panY = screenY - mapY * this.zoom;
            this.constrainPan();
            this.updateMapTransform();
        }

        constrainPan() {
            const cw = this.viewport.clientWidth;
            const ch = this.viewport.clientHeight;
            const mw = this.mapWidth * this.zoom;
            const mh = this.mapHeight * this.zoom;
            const over = 100;
            this.panX = Math.max(-mw - over, Math.min(cw + over, this.panX));
            this.panY = Math.max(-mh - over, Math.min(ch + over, this.panY));
        }

        updateMapTransform() {
            this.mapImage.style.transform =
                `translate(${this.panX}px, ${this.panY}px) scale(${this.zoom})`;
            this.updateWaypointPositions();
            this.updatePoiPositions();
            this.drawRoutes();
            this.updateHud();
        }

        toScreen(mapX, mapY) {
            return { x: mapX * this.zoom + this.panX, y: mapY * this.zoom + this.panY };
        }

        toMap(screenX, screenY) {
            return { x: (screenX - this.panX) / this.zoom, y: (screenY - this.panY) / this.zoom };
        }

        updateHud() {
            document.getElementById('zoomPct').textContent = Math.round(this.zoom * 100) + '%';
            const ruler = document.getElementById('scaleRuler');
            const value = document.getElementById('scaleValue');
            const candidates = [10, 25, 50, 100, 150, 200, 300, 500];
            let miles = candidates[candidates.length - 1];
            for (const c of candidates) {
                const px = (c / this.milesPerPixel) * this.zoom;
                if (px >= 70 && px <= 190) { miles = c; break; }
                if (px > 190) { miles = c; break; }
            }
            ruler.style.width = ((miles / this.milesPerPixel) * this.zoom) + 'px';
            value.textContent = miles + ' MİL';
        }

        /* Kamera uçuşu: hedefi görünür alanın ortasına yumuşakça getirir */
        flyTo(mapX, mapY, targetZoom) {
            this.cancelFly();
            const leftCol = document.querySelector('.side-col.left');
            const poiPanel = document.getElementById('poiPanel');
            const lw = leftCol ? leftCol.offsetWidth : 0;
            const rw = (poiPanel && poiPanel.classList.contains('open')) ? poiPanel.offsetWidth : 0;
            const cw = this.viewport.clientWidth;
            const ch = this.viewport.clientHeight;
            const cx = lw + (cw - lw - rw) / 2;
            const cy = ch / 2;

            const z1 = Math.max(this.minZoom, Math.min(this.maxZoom, targetZoom || 1.5));
            const from = { panX: this.panX, panY: this.panY, zoom: this.zoom };
            const to = { panX: cx - mapX * z1, panY: cy - mapY * z1, zoom: z1 };
            const dur = 950;
            const t0 = performance.now();
            const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

            const step = (now) => {
                if (!this.flyAnim) return;
                const t = Math.min(1, (now - t0) / dur);
                const e = ease(t);
                this.panX = from.panX + (to.panX - from.panX) * e;
                this.panY = from.panY + (to.panY - from.panY) * e;
                this.zoom = from.zoom + (to.zoom - from.zoom) * e;
                this.updateMapTransform();
                if (t < 1) this.flyAnim = requestAnimationFrame(step);
                else this.flyAnim = null;
            };
            this.flyAnim = requestAnimationFrame(step);
        }

        cancelFly() {
            if (this.flyAnim) { cancelAnimationFrame(this.flyAnim); this.flyAnim = null; }
        }

        /* ═══════════ OLAYLAR ═══════════ */

        initEventListeners() {
            this.viewport.addEventListener('pointerdown', (e) => {
                if (e.target.closest('.waypoint') || e.target.closest('.poi')) return;
                if (e.button !== undefined && e.button !== 0) return;
                this.cancelFly();
                if (this.measuring) {
                    const rect = this.viewport.getBoundingClientRect();
                    const m = this.toMap(e.clientX - rect.left, e.clientY - rect.top);
                    this.measure = { a: m, b: m };
                    this.measureDrag = true;
                    this.drawRoutes();
                    try { this.viewport.setPointerCapture(e.pointerId); } catch (err) {}
                    e.preventDefault();
                    return;
                }
                this.isPanning = true;
                this.didPan = false;
                this.dragStartX = e.clientX;
                this.dragStartY = e.clientY;
                this.lastPanX = this.panX;
                this.lastPanY = this.panY;
                try { this.viewport.setPointerCapture(e.pointerId); } catch (err) {}
                e.preventDefault();
            });

            this.viewport.addEventListener('pointermove', (e) => {
                if (this.measureDrag) {
                    const rect = this.viewport.getBoundingClientRect();
                    this.measure.b = this.toMap(e.clientX - rect.left, e.clientY - rect.top);
                    this.drawRoutes();
                    return;
                }
                if (this.poiDrag) { this.movePoiDrag(e); return; }
                if (this.wpDrag) { this.moveWaypointDrag(e); return; }
                if (!this.isPanning) return;
                const dx = e.clientX - this.dragStartX;
                const dy = e.clientY - this.dragStartY;
                if (this.didPan || Math.abs(dx) > 3 || Math.abs(dy) > 3) {
                    this.didPan = true;
                    this.viewport.classList.add('dragging');
                    this.panX = this.lastPanX + dx;
                    this.panY = this.lastPanY + dy;
                    this.constrainPan();
                    this.updateMapTransform();
                }
            });

            this.viewport.addEventListener('pointerup', (e) => {
                if (this.measureDrag) { this.measureDrag = false; return; }
                if (this.poiDrag) { this.endPoiDrag(); return; }
                if (this.wpDrag) { this.endWaypointDrag(); return; }
                if (!this.isPanning) return;
                this.isPanning = false;
                this.viewport.classList.remove('dragging');
                if (!this.didPan) {
                    const rect = this.viewport.getBoundingClientRect();
                    const sx = e.clientX - rect.left;
                    const sy = e.clientY - rect.top;
                    if (this.placingPoi) this.finishPoiPlacement(sx, sy);
                    else this.addWaypointAt(sx, sy);
                }
            });

            this.viewport.addEventListener('pointercancel', () => {
                this.isPanning = false;
                this.wpDrag = null;
                this.poiDrag = null;
                this.measureDrag = false;
                this.viewport.classList.remove('dragging');
            });

            this.viewport.addEventListener('wheel', (e) => {
                e.preventDefault();
                this.cancelFly();
                const rect = this.viewport.getBoundingClientRect();
                const delta = e.deltaY > 0 ? -0.1 : 0.1;
                this.zoomAtPoint(e.clientX - rect.left, e.clientY - rect.top, delta);
            }, { passive: false });

            document.getElementById('zoomIn').addEventListener('click', () => { this.cancelFly(); this.zoomAtCenter(0.2); });
            document.getElementById('zoomOut').addEventListener('click', () => { this.cancelFly(); this.zoomAtCenter(-0.2); });
            document.getElementById('zoomReset').addEventListener('click', () => {
                this.cancelFly();
                this.fitView();
                this.updateMapTransform();
            });
            document.getElementById('measureBtn').addEventListener('click', () => this.setMeasuring(!this.measuring));

            // Zoom seviyesi menüsü
            const zoomMenu = document.getElementById('zoomMenu');
            const zoomPct = document.getElementById('zoomPct');
            [50, 75, 100, 125, 150, 175, 200, 225, 250, 275, 300].forEach(p => {
                const b = document.createElement('button');
                b.textContent = '%' + p;
                b.dataset.zoom = p;
                b.addEventListener('click', () => {
                    this.cancelFly();
                    this.setZoomLevel(p / 100);
                    this.toggleZoomMenu(false);
                });
                zoomMenu.appendChild(b);
            });
            zoomPct.addEventListener('click', (e) => {
                e.stopPropagation();
                this.toggleZoomMenu(!zoomMenu.classList.contains('open'));
            });
            document.addEventListener('pointerdown', (e) => {
                if (!e.target.closest('.hud-zoom-wrap')) this.toggleZoomMenu(false);
            });

            document.getElementById('applyAllBtn').addEventListener('click', () => {
                const d = this.getDefaults();
                this.legs.forEach(leg => Object.assign(leg, d));
                this.saveRoute();
                this.drawRoutes();
                this.updateDetails();
                if (this.legs.length) this.showToast('Ayarlar tüm etaplara uygulandı');
            });

            document.querySelectorAll('.panel-header[data-toggle]').forEach(h => {
                h.addEventListener('click', () => h.parentElement.classList.toggle('collapsed'));
            });

            // Takvim
            document.getElementById('calToggle').addEventListener('click', () => {
                const panel = document.getElementById('calendarPanel');
                panel.classList.toggle('open');
                document.getElementById('calToggle').classList.toggle('open', panel.classList.contains('open'));
                if (panel.classList.contains('open')) {
                    this.calView = { year: this.profile.calendar.year, month: this.profile.calendar.month };
                    this.renderCalendar();
                }
            });
            document.querySelector('[data-toggle-cal]').addEventListener('click', () => {
                document.getElementById('calendarPanel').classList.remove('open');
                document.getElementById('calToggle').classList.remove('open');
            });

            // POI paneli kapatma
            document.getElementById('poiPanelClose').addEventListener('click', () => this.closePoiPanel());

            // Profil
            document.getElementById('profileAvatar').addEventListener('click', () =>
                document.getElementById('avatarInput').click());
            document.getElementById('avatarInput').addEventListener('change', (e) => this.onAvatarPicked(e));
            document.getElementById('profileName').addEventListener('click', () => this.editProfileName());
            document.getElementById('exportProfileBtn').addEventListener('click', () => this.exportProfile());
            document.getElementById('importProfileBtn').addEventListener('click', () =>
                document.getElementById('importProfileInput').click());
            document.getElementById('importProfileInput').addEventListener('change', (e) => this.onProfileFilePicked(e));
            document.getElementById('shareProfileBtn').addEventListener('click', () => this.shareProfileLink());

            // Presetler
            document.getElementById('savePresetBtn').addEventListener('click', () => this.saveCurrentAsPreset());
            document.getElementById('presetNameInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') this.saveCurrentAsPreset();
            });
            document.getElementById('importRouteBtn').addEventListener('click', () =>
                document.getElementById('importRouteInput').click());
            document.getElementById('importRouteInput').addEventListener('change', (e) => this.onRouteFilePicked(e));

            document.getElementById('galleryInput').addEventListener('change', (e) => this.onGalleryFilesPicked(e));

            window.addEventListener('keydown', (e) => {
                const tag = e.target.tagName;
                if (tag === 'SELECT' || tag === 'INPUT' || tag === 'TEXTAREA') return;
                if (document.querySelector('.lightbox')) return; // lightbox kendi tuşlarını yönetir
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                    e.preventDefault();
                    this.removeLastWaypoint();
                } else if (e.key === '+' || e.key === '=') {
                    this.zoomAtCenter(0.2);
                } else if (e.key === '-') {
                    this.zoomAtCenter(-0.2);
                } else if (e.key === '0') {
                    this.cancelFly();
                    this.fitView();
                    this.updateMapTransform();
                } else if (e.key.toLowerCase() === 'm') {
                    this.setMeasuring(!this.measuring);
                } else if (e.key === 'Escape') {
                    if (this.measuring) this.setMeasuring(false);
                    else if (this.placingPoi) this.setPlacingMode(false);
                    else if (this.selectedPoiId) this.closePoiPanel();
                    else {
                        document.getElementById('calendarPanel').classList.remove('open');
                        document.getElementById('calToggle').classList.remove('open');
                    }
                }
            });

            window.addEventListener('resize', () => {
                this.constrainPan();
                this.updateMapTransform();
            });

            // Sayfa açıkken adres çubuğuna paylaşım linki yapıştırılırsa da çalışsın
            window.addEventListener('hashchange', () => this.handleShareHash());
        }

        getDefaults() {
            return {
                pace: parseInt(this.defaultPaceSel.value),
                terrain: parseInt(this.defaultTerrainSel.value),
                dailyHours: parseInt(this.defaultHoursSel.value)
            };
        }

        setMeasuring(on) {
            this.measuring = on;
            this.measureDrag = false;
            if (!on) this.measure = null;
            this.viewport.classList.toggle('measuring', on);
            document.getElementById('measureBtn').classList.toggle('armed', on);
            if (on) {
                this.setPlacingMode(false);
                this.showToast('Cetvel: sürükleyerek ölç — Kapat: M / Esc');
            }
            this.drawRoutes();
        }

        /* ═══════════ NOKTALAR (WAYPOINT) ═══════════ */

        addWaypointAt(screenX, screenY) {
            const m = this.toMap(screenX, screenY);
            if (m.x < 0 || m.x > this.mapWidth || m.y < 0 || m.y > this.mapHeight) return;
            this.addWaypointAtMap(m.x, m.y);
        }

        addWaypointAtMap(mapX, mapY) {
            const waypoint = {
                id: ++this.waypointCounter,
                mapX, mapY,
                element: this.createWaypointElement()
            };
            this.waypoints.push(waypoint);
            if (this.waypoints.length > 1) {
                this.legs.push({ ...this.getDefaults() });
            }
            this.bindWaypointEvents(waypoint);
            this.refreshWaypointNumbers();
            this.updateWaypointPositions();
            this.drawRoutes();
            this.updateDetails();
            this.saveRoute();
        }

        createWaypointElement() {
            const el = document.createElement('div');
            el.className = 'waypoint';
            el.title = 'Sürükle: taşı · Tıkla: sil';
            this.viewport.appendChild(el);
            return el;
        }

        bindWaypointEvents(waypoint) {
            waypoint.element.addEventListener('pointerdown', (e) => {
                if (e.button !== undefined && e.button !== 0) return;
                e.stopPropagation();
                e.preventDefault();
                this.cancelFly();
                this.wpDrag = { waypoint, startX: e.clientX, startY: e.clientY, moved: false };
                waypoint.element.classList.add('dragging-wp');
                try { this.viewport.setPointerCapture(e.pointerId); } catch (err) {}
            });
            waypoint.element.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                this.removeWaypoint(waypoint.id);
            });
        }

        moveWaypointDrag(e) {
            const d = this.wpDrag;
            if (!d.moved &&
                Math.abs(e.clientX - d.startX) < 4 && Math.abs(e.clientY - d.startY) < 4) return;
            d.moved = true;
            const rect = this.viewport.getBoundingClientRect();
            const m = this.toMap(e.clientX - rect.left, e.clientY - rect.top);
            d.waypoint.mapX = Math.max(0, Math.min(this.mapWidth, m.x));
            d.waypoint.mapY = Math.max(0, Math.min(this.mapHeight, m.y));
            this.updateWaypointPositions();
            this.drawRoutes();
            this.updateDetails();
        }

        endWaypointDrag() {
            const d = this.wpDrag;
            this.wpDrag = null;
            d.waypoint.element.classList.remove('dragging-wp');
            if (d.moved) this.saveRoute();
            else this.removeWaypoint(d.waypoint.id);
        }

        removeWaypoint(id) {
            const i = this.waypoints.findIndex(w => w.id === id);
            if (i === -1) return;
            this.waypoints[i].element.remove();
            this.waypoints.splice(i, 1);
            if (this.legs.length > 0) {
                if (i === 0) this.legs.splice(0, 1);
                else if (i >= this.legs.length) this.legs.splice(this.legs.length - 1, 1);
                else this.legs.splice(i, 1);
            }
            this.highlightedLeg = -1;
            this.refreshWaypointNumbers();
            this.updateWaypointPositions();
            this.drawRoutes();
            this.updateDetails();
            this.saveRoute();
        }

        removeLastWaypoint() {
            if (this.waypoints.length === 0) return;
            this.removeWaypoint(this.waypoints[this.waypoints.length - 1].id);
        }

        refreshWaypointNumbers() {
            this.waypoints.forEach((w, i) => {
                w.element.textContent = i + 1;
                w.element.classList.toggle('first', i === 0);
            });
        }

        updateWaypointPositions() {
            this.waypoints.forEach(w => {
                const s = this.toScreen(w.mapX, w.mapY);
                w.element.style.left = s.x + 'px';
                w.element.style.top = s.y + 'px';
            });
        }

        clearAll() {
            this.waypoints.forEach(w => w.element.remove());
            this.waypoints = [];
            this.legs = [];
            this.waypointCounter = 0;
            this.highlightedLeg = -1;
            this.drawRoutes();
            this.updateDetails();
            this.saveRoute();
        }

        loadRouteData(waypoints, legs) {
            this.waypoints.forEach(w => w.element.remove());
            this.waypoints = [];
            this.legs = [];
            this.waypointCounter = 0;
            this.highlightedLeg = -1;

            (waypoints || []).forEach(p => {
                const waypoint = {
                    id: ++this.waypointCounter,
                    mapX: p.x, mapY: p.y,
                    element: this.createWaypointElement()
                };
                this.bindWaypointEvents(waypoint);
                this.waypoints.push(waypoint);
            });

            const defaults = this.getDefaults();
            const savedLegs = Array.isArray(legs) ? legs : [];
            for (let i = 0; i < this.waypoints.length - 1; i++) {
                const l = savedLegs[i] || {};
                this.legs.push({
                    pace: [30, 24, 18].includes(l.pace) ? l.pace : defaults.pace,
                    terrain: [1, 2].includes(l.terrain) ? l.terrain : defaults.terrain,
                    dailyHours: [2, 4, 6, 8, 10, 12].includes(l.dailyHours) ? l.dailyHours : defaults.dailyHours
                });
            }
            this.refreshWaypointNumbers();
            this.updateWaypointPositions();
            this.drawRoutes();
            this.updateDetails();
            this.saveRoute();
        }

        /* ═══════════ ROTA + CETVEL ÇİZİMİ ═══════════ */
