<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bestiary — Campaign 6: The Dark Path</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap');

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: url('https://cdnb.artstation.com/p/assets/images/images/031/925/857/4k/rostyslav-zagornov-throne-1upd.jpg?1604998107') no-repeat center center fixed;
      background-size: cover;
      color: white;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    h1 {
      font-family: 'UnifrakturCook', cursive;
      font-size: 4rem;
      margin: 0 0 1rem 0;
      color: #c41e3a;
      text-shadow: 0 0 20px rgba(255, 0, 0, 0.6), 0 0 40px rgba(255, 0, 0, 0.3);
      animation: pulseGlow 4s infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { text-shadow: 0 0 20px rgba(255, 0, 0, 0.6), 0 0 40px rgba(255, 0, 0, 0.3); }
      50%      { text-shadow: 0 0 40px rgba(255, 0, 0, 0.8), 0 0 60px rgba(255, 0, 0, 0.5); }
    }

    .coming-soon {
      font-size: 1.3rem;
      color: #ccc;
      border: 2px solid #444;
      background: rgba(0,0,0,0.5);
      padding: 1.2rem 2.4rem;
      border-radius: 10px;
      margin-bottom: 2rem;
    }

    .back-link {
      font-size: 1.1rem;
      color: #ccc;
      background-color: rgba(0, 0, 0, 0.5);
      padding: 0.6rem 1.2rem;
      border: 2px solid #444;
      border-radius: 10px;
      text-decoration: none;
      transition: background-color 0.3s, color 0.3s, transform 0.3s ease;
    }

    .back-link:hover {
      background-color: rgba(255, 0, 0, 0.2);
      color: #fff;
      transform: scale(1.05);
    }

    .back-link::before {
      content: "⮐ ";
    }
  </style>
</head>
<body>
  <h1>Bestiary</h1>
  <div class="coming-soon">Bu bölüm henüz kayıt altına alınmadı. Yakında...</div>
  <a class="back-link" href="../index.html">Ana Menü</a>
<script>
  window.SPLASH_CURSOR_CONFIG = {
    RAINBOW_MODE: false,
    COLOR: '#c41e3a',
    COLOR_PALETTE: ['#c41e3a', '#ff5540', '#7b1a14', '#2c0a0a']
  };
</script>
<script src="../../../splash-cursor.js"></script>
</body>
</html>
